<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-accent: oklch(0.69 0.16 41);
  --color-accent-light: oklch(0.78 0.09 41);
  --color-accent-dark: oklch(0.44 0.14 41);
  --color-accent-muted: oklch(0.93 0.03 41);
  --color-surface: white;
  --color-surface-raised: oklch(0.96 0.005 250);
  --color-surface-sunken: oklch(0.935 0.006 250);
  --color-text: oklch(0.14 0.01 250);
  --color-text-secondary: oklch(0.4 0.012 250);
  --color-text-tertiary: oklch(0.58 0.01 250);
  --color-text-on-accent: oklch(0.97 0.005 250);
  --color-border: oklch(0.86 0.006 250);
  --color-border-strong: oklch(0.72 0.012 250);
  --font-display: "Source Serif 4", serif;
  --font-body: "Manrope", sans-serif;
  --font-mono: "Geist Mono", monospace;
  --text-xs: 0.6875rem;
  --text-sm: 0.8125rem;
  --text-base: 1rem;
  --text-md: 1.25rem;
  --text-lg: 1.563rem;
  --text-xl: 1.953rem;
  --text-2xl: 2.441rem;
  --text-3xl: clamp(2.8rem, 5.5vw, 3.815rem);
  --text-4xl: clamp(3.2rem, 7vw, 5.06rem);
  --leading-tight: 1.08;
  --leading-snug: 1.25;
  --leading-normal: 1.6;
  --leading-relaxed: 1.8;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-24: 6rem;
  --radius-xs: 2px;
  --radius-sm: 3px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-xl: 10px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px oklch(0.22 0.005 250 / 0.07);
  --shadow-md: 0 2px 8px oklch(0.22 0.005 250 / 0.09);
  --shadow-lg: 0 6px 24px oklch(0.22 0.005 250 / 0.12);
  --gutter: clamp(1rem, 3vw, 2rem);
  --ease-out-expo: cubic-bezier(0.16,1,0.3,1);
  --duration-fast: 180ms;
  --duration-base: 340ms;
  --duration-slow: 550ms;
  --color-success: oklch(0.68 0.14 160);
  --color-warning: oklch(0.76 0.13 80);
  --color-danger: oklch(0.58 0.17 22);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:var(--leading-normal);color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width,72rem);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
h2{font-family:var(--font-display);font-size:var(--text-lg);font-weight:600;letter-spacing:-0.01em;color:var(--color-text);margin-bottom:var(--space-3)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);display:flex;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-6)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-2);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);font-family:var(--font-body);font-size:10px;font-weight:700;line-height:1;letter-spacing:-0.02em}
.badge-default{background:var(--color-surface-sunken);color:var(--color-text-secondary);border:1px solid var(--color-border)}
.badge-accent{background:var(--color-accent);color:var(--color-text-on-accent)}
.badge-danger{background:oklch(0.55 0.2 22);color:white}
</style>
</head>
<body>
<div class="page">
  <h1>Badge</h1>
  <p class="desc">Notification badge component with count display and variant styles.</p>
  <div class="demo-label">Variants</div>
  <div class="demo">
    <span class="badge badge-default">5</span>
    <span class="badge badge-accent">12</span>
    <span class="badge badge-danger">3</span>
  </div>
  <div class="demo-label">Overflow (99+)</div>
  <div class="demo">
    <span class="badge badge-default">99+</span>
    <span class="badge badge-accent">99+</span>
    <span class="badge badge-danger">99+</span>
  </div>
  <div class="demo-label">Small counts</div>
  <div class="demo">
    <span class="badge badge-default">0</span>
    <span class="badge badge-accent">1</span>
    <span class="badge badge-danger">42</span>
  </div>
</div>
</body>
</html>
