<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breadcrumb Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-dark:oklch(0.44 0.14 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-sm:0 1px 2px oklch(0.22 0.005 250 / 0.07);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
h2{font-family:var(--font-display);font-size:var(--text-lg);font-weight:600;letter-spacing:-0.01em;color:var(--color-text);margin-bottom:var(--space-3)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-2);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}

.breadcrumb{display:flex;align-items:center}
.breadcrumb-list{display:flex;align-items:center;gap:0;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.breadcrumb-item{display:inline-flex;align-items:center;gap:0}
.breadcrumb-link{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:300;color:var(--color-text-secondary);text-decoration:none;padding:2px var(--space-1);border-radius:var(--radius-xs);transition:color var(--duration-fast) ease}
.breadcrumb-link:hover{color:var(--color-accent)}
.breadcrumb-link:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.breadcrumb-sep{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;color:var(--color-text-tertiary);flex-shrink:0}
.breadcrumb-current{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:400;color:var(--color-text);padding:2px var(--space-1)}
</style>
</head>
<body>
<div class="page">
<h1>Breadcrumb</h1>
<p class="desc">Navigation breadcrumb showing the current page hierarchy.</p>

<div class="demo-label">Basic breadcrumb</div>
<div class="demo">
<nav aria-label="Breadcrumb" class="breadcrumb">
<ol class="breadcrumb-list">
<li class="breadcrumb-item"><a href="/" class="breadcrumb-link">Home</a><span class="breadcrumb-sep" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></li>
<li class="breadcrumb-item"><a href="/cases" class="breadcrumb-link">Cases</a><span class="breadcrumb-sep" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></li>
<li class="breadcrumb-item"><span class="breadcrumb-current" aria-current="page">Case Details</span></li>
</ol>
</nav>
</div>

<div class="demo-label">Deep hierarchy</div>
<div class="demo">
<nav aria-label="Breadcrumb" class="breadcrumb">
<ol class="breadcrumb-list">
<li class="breadcrumb-item"><a href="/" class="breadcrumb-link">Home</a><span class="breadcrumb-sep" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></li>
<li class="breadcrumb-item"><a href="/projects" class="breadcrumb-link">Projects</a><span class="breadcrumb-sep" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></li>
<li class="breadcrumb-item"><a href="/projects/lrs" class="breadcrumb-link">LRS</a><span class="breadcrumb-sep" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></li>
<li class="breadcrumb-item"><a href="/projects/lrs/students" class="breadcrumb-link">Students</a><span class="breadcrumb-sep" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></li>
<li class="breadcrumb-item"><span class="breadcrumb-current" aria-current="page">Details</span></li>
</ol>
</nav>
</div>
</div>
</body>
</html>
