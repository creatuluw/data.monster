<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-dark:oklch(0.44 0.14 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--color-danger:oklch(0.58 0.17 22);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
h2{font-family:var(--font-display);font-size:var(--text-lg);font-weight:600;letter-spacing:-0.01em;color:var(--color-text);margin-bottom:var(--space-3)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.flex-wrap{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);font-family:var(--font-body);font-size:var(--text-xs);font-weight:600;line-height:1.4;cursor:pointer;border:1px solid transparent;border-radius:var(--radius-xs);text-decoration:none;transition:transform var(--duration-fast) var(--ease-out-expo),background var(--duration-fast) ease,color var(--duration-fast) ease,border-color var(--duration-fast) ease}
.btn:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--color-accent);color:var(--color-text-on-accent);border-color:var(--color-accent)}
.btn-primary:hover{background:var(--color-accent-dark);border-color:var(--color-accent-dark)}
.btn-secondary{background:transparent;color:var(--color-text);border-color:var(--color-border-strong)}
.btn-secondary:hover{border-color:var(--color-accent);color:var(--color-accent)}
.btn-ghost{background:transparent;color:var(--color-text-secondary);border-color:transparent}
.btn-ghost:hover{background:var(--color-surface-sunken);color:var(--color-text)}
.btn-danger{background:var(--color-danger);color:oklch(0.97 0.005 22);border-color:var(--color-danger)}
.btn-danger:hover{background:oklch(0.48 0.15 22);border-color:oklch(0.48 0.15 22)}
.btn-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;background:transparent;border:1px solid transparent;border-radius:var(--radius-xs);cursor:pointer;color:var(--color-text-tertiary);transition:color var(--duration-fast) ease,background var(--duration-fast) ease,border-color var(--duration-fast) ease}
.btn-icon:hover{color:var(--color-text);background:var(--color-surface-sunken);border-color:var(--color-border)}
.btn-icon:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.btn-sm{padding:var(--space-1) var(--space-3);font-size:9px}
.btn-lg{padding:var(--space-3) var(--space-8);font-size:var(--text-sm)}
</style>
</head>
<body>
<div class="page">
<h1>Button</h1>
<p class="desc">Versatile button component with multiple variants, sizes, and states.</p>

<div class="demo-label">Variants</div>
<div class="demo">
<div class="flex-wrap">
<button class="btn btn-primary">Primary</button>
<button class="btn btn-secondary">Secondary</button>
<button class="btn btn-ghost">Ghost</button>
<button class="btn btn-danger">Danger</button>
</div>
</div>

<div class="demo-label">Sizes</div>
<div class="demo">
<div class="flex-wrap">
<button class="btn btn-primary btn-sm">Small</button>
<button class="btn btn-primary">Default</button>
<button class="btn btn-primary btn-lg">Large</button>
</div>
</div>

<div class="demo-label">States</div>
<div class="demo">
<div class="flex-wrap">
<button class="btn btn-primary">Normal</button>
<button class="btn btn-primary" disabled>Disabled</button>
<button class="btn btn-secondary" disabled>Disabled Secondary</button>
</div>
</div>

<div class="demo-label">Icon buttons</div>
<div class="demo">
<div class="flex-wrap">
<button class="btn-icon" aria-label="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
<button class="btn-icon" aria-label="Delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
<button class="btn-icon" aria-label="Settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>
</div>

<div class="demo-label">Link-style button</div>
<div class="demo">
<a href="#" class="btn btn-primary" onclick="event.preventDefault()">Link Button</a>
</div>
</div>
</body>
</html>
