<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConditionBuilder Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-muted:oklch(0.93 0.03 41);--color-accent-dark:oklch(0.44 0.14 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-text-placeholder:oklch(0.72 0.008 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.condition-group{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface-raised)}
.condition-row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.condition-field{padding:var(--space-1) var(--space-2);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text);background:var(--color-surface);min-width:100px}
.condition-operator{padding:var(--space-1) var(--space-2);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text);background:var(--color-surface)}
.condition-value{padding:var(--space-1) var(--space-2);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text);background:var(--color-surface);min-width:80px}
.condition-remove{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--color-border);border-radius:var(--radius-xs);cursor:pointer;color:var(--color-text-tertiary)}
.condition-remove:hover{color:oklch(0.55 0.2 22);border-color:oklch(0.55 0.2 22)}
.condition-join{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:600;color:var(--color-accent);padding:var(--space-1) 0;text-transform:uppercase}
.btn-sm{display:inline-flex;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-3);font-family:var(--font-body);font-size:9px;font-weight:600;cursor:pointer;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:var(--color-surface);color:var(--color-text-secondary);transition:all var(--duration-fast) ease}
.btn-sm:hover{border-color:var(--color-accent);color:var(--color-accent)}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2);background:var(--color-accent-muted);color:var(--color-accent-dark);border:1px solid var(--color-accent-muted);border-radius:var(--radius-xs);font-size:9px;font-weight:600;font-family:var(--font-body)}
</style>
</head>
<body>
<div class="page">
<h1>ConditionBuilder</h1>
<p class="desc">Visual condition builder with field/operator/value rows and AND/OR logic grouping.</p>
<div class="demo-label">Filter conditions</div>
<div class="demo">
<div class="condition-group">
<div class="condition-row">
<select class="condition-field"><option>Status</option><option>Group</option><option>Progress</option></select>
<select class="condition-operator"><option>equals</option><option>not equals</option><option>contains</option></select>
<input class="condition-value" value="Active" placeholder="Value">
<button class="condition-remove" aria-label="Remove"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<div class="condition-join">AND</div>
<div class="condition-row">
<select class="condition-field"><option>Group</option><option>Status</option><option>Progress</option></select>
<select class="condition-operator"><option>equals</option><option>not equals</option></select>
<input class="condition-value" value="DG-3A" placeholder="Value">
<button class="condition-remove" aria-label="Remove"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<div class="condition-join">AND</div>
<div class="condition-row">
<select class="condition-field"><option>Progress</option><option>Status</option><option>Group</option></select>
<select class="condition-operator"><option>&gt;</option><option>&lt;</option><option>=</option></select>
<input class="condition-value" value="75" placeholder="Value" style="width:60px">
<button class="condition-remove" aria-label="Remove"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<div style="margin-top:var(--space-3);display:flex;gap:var(--space-2)">
<button class="btn-sm">+ Add Condition</button>
<button class="btn-sm">+ Add OR Group</button>
</div>
</div>
<div style="margin-top:var(--space-4)">
<span class="chip">Status = Active</span>
<span class="chip" style="margin-left:var(--space-2)">Group = DG-3A</span>
<span class="chip" style="margin-left:var(--space-2)">Progress > 75</span>
</div>
</div>
</div>
</body>
</html>
