<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DatePicker Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-muted:oklch(0.93 0.03 41);--color-accent-dark:oklch(0.44 0.14 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-text-placeholder:oklch(0.72 0.008 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-md:0 2px 8px oklch(0.22 0.005 250 / 0.09);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.field{display:flex;flex-direction:column;gap:var(--space-2);max-width:320px}
.field-label{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.44 0.14 41)}
.field-hint{font-family:var(--font-mono);font-size:9px;color:var(--color-text-tertiary);letter-spacing:0.02em}
.date-input-row{display:flex;align-items:center;gap:var(--space-2)}
.date-input{padding:var(--space-2) var(--space-3);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text);background:var(--color-surface);flex:1;transition:border-color var(--duration-fast) ease,box-shadow var(--duration-fast) ease}
.date-input:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 2px var(--color-accent-muted)}
.date-input::placeholder{color:var(--color-text-placeholder);font-size:var(--text-xs);font-weight:300}
.calendar-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;border:1px solid var(--color-border);border-radius:var(--radius-xs);cursor:pointer;color:var(--color-text-tertiary);flex-shrink:0;transition:color var(--duration-fast) ease,border-color var(--duration-fast) ease}
.calendar-btn:hover{color:var(--color-accent);border-color:var(--color-accent)}
.calendar-popup{position:absolute;top:100%;left:0;margin-top:var(--space-1);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:100;padding:var(--space-4);display:none;width:280px}
.calendar-popup.open{display:block}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)}
.calendar-nav{display:flex;align-items:center;justify-content:center;width:28px;height:28px;background:transparent;border:1px solid var(--color-border);border-radius:var(--radius-xs);cursor:pointer;color:var(--color-text-tertiary)}
.calendar-nav:hover{color:var(--color-accent);border-color:var(--color-accent)}
.calendar-month{font-family:var(--font-display);font-size:var(--text-sm);font-weight:600;color:var(--color-text)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calendar-day-header{font-family:var(--font-mono);font-size:9px;color:var(--color-text-tertiary);text-align:center;padding:var(--space-1) 0}
.calendar-day{display:flex;align-items:center;justify-content:center;height:32px;font-family:var(--font-body);font-size:var(--text-xs);color:var(--color-text);border:none;background:transparent;border-radius:var(--radius-xs);cursor:pointer;transition:background var(--duration-fast) ease,color var(--duration-fast) ease}
.calendar-day:hover:not(.empty):not(.selected){background:var(--color-surface-sunken)}
.calendar-day.selected{background:var(--color-accent);color:var(--color-text-on-accent)}
.calendar-day.today{border:1px solid var(--color-accent)}
.calendar-day.empty{cursor:default}
.date-picker-wrap{position:relative}
</style>
</head>
<body>
<div class="page">
<h1>DatePicker</h1>
<p class="desc">Date input with calendar popup for selecting dates in YYYY-MM-DD format.</p>
<div class="demo">
<div class="field">
<label class="field-label">Event Date</label>
<div class="date-picker-wrap">
<div class="date-input-row">
<input type="text" class="date-input" id="dp-input" placeholder="YYYY-MM-DD" readonly>
<button class="calendar-btn" id="dp-trigger" onclick="toggleCalendar()" aria-label="Open calendar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
</div>
<div class="calendar-popup" id="dp-calendar">
<div class="calendar-header">
<button class="calendar-nav" onclick="navMonth(-1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
<span class="calendar-month" id="dp-month-label"></span>
<button class="calendar-nav" onclick="navMonth(1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
</div>
<div class="calendar-grid" id="dp-grid"></div>
</div>
</div>
<span class="field-hint">Select a date from the calendar</span>
</div>
</div>
<script>
var today=new Date();var cMonth=today.getMonth();var cYear=today.getFullYear();var selectedDate=null;
var dayNames=['Su','Mo','Tu','We','Th','Fr','Sa'];var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderCalendar(){
var grid=document.getElementById('dp-grid');
document.getElementById('dp-month-label').textContent=monthNames[cMonth]+' '+cYear;
var html='';
dayNames.forEach(function(d){html+='<div class="calendar-day-header">'+d+'</div>'});
var firstDay=new Date(cYear,cMonth,1).getDay();
var daysInMonth=new Date(cYear,cMonth+1,0).getDate();
for(var i=0;i<firstDay;i++)html+='<div class="calendar-day empty"></div>';
for(var d=1;d<=daysInMonth;d++){
var cls='calendar-day';
if(d===today.getDate()&&cMonth===today.getMonth()&&cYear===today.getFullYear())cls+=' today';
if(selectedDate&&d===selectedDate.getDate()&&cMonth===selectedDate.getMonth()&&cYear===selectedDate.getFullYear())cls+=' selected';
html+='<button class="'+cls+'" onclick="selectDate('+d+')">'+d+'</button>';
}
grid.innerHTML=html;
}
function selectDate(d){
selectedDate=new Date(cYear,cMonth,d);
var yyyy=selectedDate.getFullYear();
var mm=String(selectedDate.getMonth()+1).padStart(2,'0');
var dd=String(selectedDate.getDate()).padStart(2,'0');
document.getElementById('dp-input').value=yyyy+'-'+mm+'-'+dd;
document.getElementById('dp-calendar').classList.remove('open');
renderCalendar();
}
function navMonth(dir){cMonth+=dir;if(cMonth>11){cMonth=0;cYear++}if(cMonth<0){cMonth=11;cYear--}renderCalendar()}
function toggleCalendar(){document.getElementById('dp-calendar').classList.toggle('open');renderCalendar()}
document.addEventListener('click',function(e){var wrap=document.querySelector('.date-picker-wrap');if(wrap&&!wrap.contains(e.target))document.getElementById('dp-calendar').classList.remove('open')});
renderCalendar();
</script>
</div>
</body>
</html>
