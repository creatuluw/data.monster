<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EllipsisMenu Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-border:oklch(0.86 0.006 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-md:0 2px 8px oklch(0.22 0.005 250 / 0.09);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.ellipsis-menu{position:relative;display:inline-block}
.ellipsis-trigger{display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;border:1px solid transparent;border-radius:var(--radius-xs);cursor:pointer;color:var(--color-text-tertiary);transition:color var(--duration-fast) ease,background var(--duration-fast) ease,border-color var(--duration-fast) ease}
.ellipsis-trigger:hover,.ellipsis-trigger.open{color:var(--color-text);background:var(--color-surface-sunken);border-color:var(--color-border)}
.ellipsis-trigger:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.ellipsis-dropdown{position:absolute;top:100%;right:0;min-width:180px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:100;display:none;animation:slideDown var(--duration-fast) var(--ease-out-expo) both;margin-top:4px}
.ellipsis-dropdown.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.ellipsis-item{display:flex;align-items:center;gap:var(--space-2);width:100%;padding:var(--space-2) var(--space-3);font-family:var(--font-body);font-size:var(--text-sm);font-weight:500;color:var(--color-text-secondary);text-decoration:none;background:transparent;border:none;cursor:pointer;text-align:left;transition:color var(--duration-fast) ease,background var(--duration-fast) ease}
.ellipsis-item:hover{color:var(--color-text);background:var(--color-surface-sunken)}
.ellipsis-item:first-child{border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.ellipsis-item:last-child{border-radius:0 0 var(--radius-sm) var(--radius-sm)}
.flex-row{display:flex;align-items:center;gap:var(--space-4)}
</style>
</head>
<body>
<div class="page">
<h1>EllipsisMenu</h1>
<p class="desc">Overflow action menu triggered by vertical/horizontal ellipsis button.</p>
<div class="demo-label">Vertical (default) and Horizontal variants</div>
<div class="demo">
<div class="flex-row">
<!-- Vertical -->
<div class="ellipsis-menu" id="em1">
<button class="ellipsis-trigger" onclick="toggleEM('em1')" aria-label="Actions" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
<div class="ellipsis-dropdown">
<button class="ellipsis-item" onclick="closeEM('em1')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>
<button class="ellipsis-item" onclick="closeEM('em1')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Share</button>
<button class="ellipsis-item" onclick="closeEM('em1')" style="color:oklch(0.58 0.17 22)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>
</div>
</div>
<!-- Horizontal -->
<div class="ellipsis-menu" id="em2">
<button class="ellipsis-trigger" onclick="toggleEM('em2')" aria-label="Actions" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
<div class="ellipsis-dropdown">
<button class="ellipsis-item" onclick="closeEM('em2')">Copy</button>
<button class="ellipsis-item" onclick="closeEM('em2')">Duplicate</button>
<button class="ellipsis-item" onclick="closeEM('em2')">Archive</button>
</div>
</div>
</div>
</div>

<script>
function toggleEM(id){
var menu=document.getElementById(id);var dd=menu.querySelector('.ellipsis-dropdown');var trig=menu.querySelector('.ellipsis-trigger');
var isOpen=dd.classList.contains('open');
document.querySelectorAll('.ellipsis-dropdown.open').forEach(function(x){x.classList.remove('open')});
document.querySelectorAll('.ellipsis-trigger.open').forEach(function(x){x.classList.remove('open')});
if(!isOpen){dd.classList.add('open');trig.classList.add('open')}
}
function closeEM(id){var menu=document.getElementById(id);menu.querySelector('.ellipsis-dropdown').classList.remove('open');menu.querySelector('.ellipsis-trigger').classList.remove('open')}
document.addEventListener('click',function(e){if(!e.target.closest('.ellipsis-menu')){document.querySelectorAll('.ellipsis-dropdown.open').forEach(function(x){x.classList.remove('open')});document.querySelectorAll('.ellipsis-trigger.open').forEach(function(x){x.classList.remove('open')})}})
</script>
</div>
</body>
</html>
