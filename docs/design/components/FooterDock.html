<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FooterDock Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-border:oklch(0.86 0.006 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-md:0 2px 8px oklch(0.22 0.005 250 / 0.09);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--duration-base:340ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:var(--space-8);background:var(--color-surface-sunken)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.footer-dock{position:relative;background:var(--color-surface);border-top:1px solid var(--color-border);padding:var(--space-2) var(--gutter);display:flex;align-items:center;justify-content:space-between}
.dock-left{display:flex;align-items:center;gap:var(--space-2)}
.dock-right{display:flex;align-items:center;gap:var(--space-2)}
.dock-btn{display:flex;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-2);font-family:var(--font-body);font-size:9px;font-weight:600;color:var(--color-text-secondary);background:transparent;border:1px solid transparent;border-radius:var(--radius-xs);cursor:pointer;transition:all var(--duration-fast) ease;text-decoration:none}
.dock-btn:hover{color:var(--color-text);background:var(--color-surface-sunken);border-color:var(--color-border)}
.dock-btn.active{color:var(--color-accent)}
.dock-divider{width:1px;height:16px;background:var(--color-border)}
.dock-submenu{position:absolute;bottom:100%;left:0;right:0;background:var(--color-surface);border:1px solid var(--color-border);border-bottom:none;box-shadow:var(--shadow-md);display:none;padding:var(--space-3) var(--space-4);flex-wrap:wrap;gap:var(--space-3)}
.dock-submenu.open{display:flex}
.submenu-item{padding:var(--space-1) var(--space-3);font-family:var(--font-mono);font-size:9px;color:var(--color-text-secondary);text-decoration:none;border-radius:var(--radius-xs);transition:color var(--duration-fast) ease,background var(--duration-fast) ease;white-space:nowrap}
.submenu-item:hover{color:var(--color-text);background:var(--color-surface-sunken)}
</style>
</head>
<body>
<div class="page">
<h1>FooterDock</h1>
<p class="desc">Bottom dock bar with navigation shortcuts, admin tools, and submenus.</p>
<div class="demo-label">Footer dock</div>
<div class="demo">
<div style="position:relative;min-height:120px">
<div class="footer-dock" style="position:absolute;bottom:0;left:0;right:0">
<div class="dock-left">
<button class="dock-btn active" onclick="event.preventDefault()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Dashboard</button>
<button class="dock-btn" onclick="event.preventDefault()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Students</button>
</div>
<div class="dock-right">
<div class="dock-divider"></div>
<button class="dock-btn" id="admin-btn" onclick="toggleSubmenu()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg> Admin</button>
<button class="dock-btn" id="docs-btn" onclick="toggleSubmenu2()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Docs</button>
</div>
<div class="dock-submenu" id="admin-submenu">
<a href="#" class="submenu-item" onclick="event.preventDefault()">Users</a>
<a href="#" class="submenu-item" onclick="event.preventDefault()">Settings</a>
<a href="#" class="submenu-item" onclick="event.preventDefault()">Logs</a>
<a href="#" class="submenu-item" onclick="event.preventDefault()">Backup</a>
</div>
<div class="dock-submenu" id="docs-submenu">
<a href="#" class="submenu-item" onclick="event.preventDefault()">API Reference</a>
<a href="#" class="submenu-item" onclick="event.preventDefault()">Guides</a>
<a href="#" class="submenu-item" onclick="event.preventDefault()">Changelog</a>
</div>
</div>
</div>
</div>
<script>
function toggleSubmenu(){var m=document.getElementById('admin-submenu');document.getElementById('docs-submenu').classList.remove('open');m.classList.toggle('open')}
function toggleSubmenu2(){var m=document.getElementById('docs-submenu');document.getElementById('admin-submenu').classList.remove('open');m.classList.toggle('open')}
</script>
</div>
</body>
</html>
