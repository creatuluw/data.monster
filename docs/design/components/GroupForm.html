<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroupForm Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-muted:oklch(0.93 0.03 41);--color-accent-dark:oklch(0.44 0.14 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-text-placeholder:oklch(0.72 0.008 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:600px;margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.field{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4)}
.field:last-child{margin-bottom:0}
.field-label{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-dark)}
.field-hint{font-family:var(--font-mono);font-size:9px;color:var(--color-text-tertiary);letter-spacing:0.02em}
.input{padding:var(--space-2) var(--space-3);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:var(--text-sm);color:var(--color-text);background:var(--color-surface);width:100%;transition:border-color var(--duration-fast) ease,box-shadow var(--duration-fast) ease}
.input:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 2px var(--color-accent-muted)}
.input::placeholder{color:var(--color-text-placeholder);font-size:var(--text-xs);font-weight:300}
.select-wrap{position:relative}
.select-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) var(--space-3);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);background:var(--color-surface);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text);cursor:pointer;transition:border-color var(--duration-fast) ease}
.select-trigger:hover{border-color:var(--color-accent)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);font-family:var(--font-body);font-size:var(--text-xs);font-weight:600;cursor:pointer;border:1px solid transparent;border-radius:var(--radius-xs);transition:transform var(--duration-fast) ease}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--color-accent);color:var(--color-text-on-accent);border-color:var(--color-accent)}
.btn-primary:hover{background:var(--color-accent-dark)}
.btn-secondary{background:transparent;color:var(--color-text);border-color:var(--color-border-strong)}
.btn-secondary:hover{border-color:var(--color-accent);color:var(--color-accent)}
.form-actions{display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-6)}
</style>
</head>
<body>
<div class="page">
<h1>GroupForm</h1>
<p class="desc">Form component for creating/editing student groups with validation.</p>
<div class="demo">
<div class="field"><label class="field-label" for="gf-name">Group Name</label><input id="gf-name" class="input" placeholder="e.g. DG-3A" value="DG-3A"></div>
<div class="field"><label class="field-label" for="gf-code">Group Code</label><input id="gf-code" class="input" placeholder="Short identifier" value="DG3A"><span class="field-hint">Used for internal reference</span></div>
<div class="field"><label class="field-label">Mentor</label><div class="select-wrap"><button class="select-trigger" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">Kees van Dijk <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--color-surface);border:1px solid var(--color-accent);z-index:10;max-height:150px;overflow-y:auto"><button style="display:block;width:100%;padding:var(--space-2);text-align:left;border:none;background:transparent;cursor:pointer;font-family:var(--font-mono);font-size:var(--text-xs)" onclick="this.closest('.select-wrap').querySelector('.select-trigger').childNodes[0].textContent='Kees van Dijk';this.parentElement.style.display='none'">Kees van Dijk</button><button style="display:block;width:100%;padding:var(--space-2);text-align:left;border:none;background:transparent;cursor:pointer;font-family:var(--font-mono);font-size:var(--text-xs)" onclick="this.closest('.select-wrap').querySelector('.select-trigger').childNodes[0].textContent='Anna de Boer';this.parentElement.style.display='none'">Anna de Boer</button></div></div></div>
<div class="field"><label class="field-label" for="gf-year">Academic Year</label><input id="gf-year" class="input" placeholder="2024-2025" value="2024-2025"></div>
<div class="form-actions"><button class="btn btn-secondary">Cancel</button><button class="btn btn-primary">Save Group</button></div>
</div>
</div>
</body>
</html>
