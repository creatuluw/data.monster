<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-border:oklch(0.86 0.006 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) var(--gutter);border-bottom:1px solid var(--color-border);background:var(--color-surface);height:52px}
.header-left{display:flex;align-items:center;gap:var(--space-4)}
.header-logo{font-family:var(--font-display);font-size:var(--text-md);font-weight:700;letter-spacing:-0.02em;color:var(--color-text);text-decoration:none}
.header-nav{display:flex;align-items:center;gap:var(--space-1)}
.nav-item{padding:var(--space-1) var(--space-3);font-family:var(--font-body);font-size:var(--text-sm);font-weight:500;color:var(--color-text-secondary);text-decoration:none;border-radius:var(--radius-xs);transition:color var(--duration-fast) ease,background var(--duration-fast) ease}
.nav-item:hover{color:var(--color-text);background:var(--color-surface-sunken)}
.nav-item.active{color:var(--color-accent);background:var(--color-accent-muted)}
.header-right{display:flex;align-items:center;gap:var(--space-3)}
.user-email{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-tertiary)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);font-family:var(--font-body);font-size:var(--text-xs);font-weight:600;line-height:1.4;cursor:pointer;border:1px solid transparent;border-radius:var(--radius-xs);transition:transform var(--duration-fast) ease,background var(--duration-fast) ease,color var(--duration-fast) ease}
.btn:active{transform:scale(0.97)}
.btn-secondary{background:transparent;color:var(--color-text);border-color:var(--color-border);font-family:var(--font-body)}
.btn-secondary:hover{border-color:var(--color-accent);color:var(--color-accent)}
</style>
</head>
<body>
<div class="page">
<h1>Header</h1>
<p class="desc">Top navigation header with logo, nav links, user info, and action buttons.</p>
<div class="demo-label">App header</div>
<div class="demo">
<header class="header">
<div class="header-left">
<a href="#" class="header-logo" onclick="event.preventDefault()">LRS Platform</a>
<nav class="header-nav">
<a href="#" class="nav-item active" onclick="event.preventDefault()">Dashboard</a>
<a href="#" class="nav-item" onclick="event.preventDefault()">Students</a>
<a href="#" class="nav-item" onclick="event.preventDefault()">Cases</a>
<a href="#" class="nav-item" onclick="event.preventDefault()">Reports</a>
</nav>
</div>
<div class="header-right">
<span class="user-email">kees@school.nl</span>
<button class="btn btn-secondary" onclick="alert('Logout clicked')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</button>
</div>
</header>
</div>
</div>
</body>
</html>
