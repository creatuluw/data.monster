<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-placeholder:oklch(0.72 0.008 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--color-danger:oklch(0.58 0.17 22);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:600px;margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-6)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.field{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4)}
.field:last-child{margin-bottom:0}
.field-label{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.44 0.14 41)}
.field-hint{font-family:var(--font-mono);font-size:9px;color:var(--color-text-tertiary);letter-spacing:0.02em}
.input{padding:var(--space-2) var(--space-3);border:1px solid var(--color-border-strong);color:var(--color-text);background:var(--color-surface);border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:var(--text-sm);transition:border-color var(--duration-fast) ease,box-shadow var(--duration-fast) ease}
.input::placeholder{color:var(--color-text-placeholder);font-size:var(--text-xs);font-weight:300;font-family:var(--font-mono)}
.input:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 2px var(--color-accent-muted)}
</style>
</head>
<body>
<div class="page">
<h1>Input</h1>
<p class="desc">Text input field with label, hint, and validation styling.</p>
<div class="demo">
<div class="field"><label class="field-label" for="in1">Full Name</label><input id="in1" type="text" class="input" placeholder="Enter your name"></div>
<div class="field"><label class="field-label" for="in2">Email Address</label><input id="in2" type="email" class="input" placeholder="you@example.com"><span class="field-hint">We'll never share your email</span></div>
<div class="field"><label class="field-label" for="in3">Password</label><input id="in3" type="password" class="input" placeholder="Minimum 8 characters" required></div>
<div class="field"><label class="field-label" for="in4">Disabled</label><input id="in4" type="text" class="input" placeholder="Cannot edit" disabled></div>
</div>
</div>
</body>
</html>
