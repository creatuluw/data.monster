<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Label Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-border:oklch(0.86 0.006 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-sm:0 1px 2px oklch(0.22 0.005 250 / 0.07);--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem;--color-success:oklch(0.68 0.14 160);--color-warning:oklch(0.76 0.13 80);--color-danger:oklch(0.58 0.17 22)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);display:flex;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-4);align-items:center}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-2);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.label{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-3);font-family:var(--font-body);font-size:9px;font-weight:600;line-height:1.5;border-radius:var(--radius-xs);border:1px solid;letter-spacing:0.02em}
.label-default{background:var(--color-surface-sunken);color:var(--color-text-secondary);border-color:var(--color-border)}
.label-accent{background:var(--color-accent);color:var(--color-text-on-accent);border-color:var(--color-accent)}
.label-success{background:oklch(0.95 0.03 160);color:oklch(0.4 0.1 160);border-color:oklch(0.88 0.04 160)}
.label-warning{background:oklch(0.96 0.03 80);color:oklch(0.42 0.1 80);border-color:oklch(0.9 0.03 80)}
.label-danger{background:oklch(0.95 0.03 22);color:oklch(0.38 0.12 22);border-color:oklch(0.9 0.04 22)}
</style>
</head>
<body>
<div class="page">
<h1>Label</h1>
<p class="desc">Badge-like label for status indication and inline tags.</p>
<div class="demo-label">Variants</div>
<div class="demo">
<span class="label label-default">Default</span>
<span class="label label-accent">Accent</span>
<span class="label label-success">Success</span>
<span class="label label-warning">Warning</span>
<span class="label label-danger">Danger</span>
</div>
<div class="demo-label">Common use cases</div>
<div class="demo">
<span class="label label-success">Active</span>
<span class="label label-warning">Pending</span>
<span class="label label-danger">Error</span>
<span class="label label-default">Draft</span>
<span class="label label-accent">New</span>
</div>
</div>
</body>
</html>
