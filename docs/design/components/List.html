<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-surface:white;--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-border:oklch(0.86 0.006 250);--color-grid:oklch(0.9 0.004 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-sm:3px;--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-2);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.list{display:flex;flex-direction:column;margin:0}
.list-row{display:grid;grid-template-columns:10ch 1fr;gap:var(--space-4);align-items:baseline;padding:var(--space-3) 0;border-bottom:1px solid var(--color-grid)}
.list-row:last-child{border-bottom:none}
.list-label{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-text-tertiary);margin:0}
.list-value{font-size:var(--text-sm);color:var(--color-text);line-height:1.8;margin:0}
</style>
</head>
<body>
<div class="page">
<h1>List</h1>
<p class="desc">Definition list displaying label-value pairs in a grid layout.</p>
<div class="demo-label">Student details</div>
<div class="demo">
<dl class="list">
<div class="list-row"><dt class="list-label">Name</dt><dd class="list-value">Emma de Vries</dd></div>
<div class="list-row"><dt class="list-label">Student ID</dt><dd class="list-value">S-2024-0147</dd></div>
<div class="list-row"><dt class="list-label">Group</dt><dd class="list-value">DG-3A</dd></div>
<div class="list-row"><dt class="list-label">Role</dt><dd class="list-value">Student</dd></div>
<div class="list-row"><dt class="list-label">Status</dt><dd class="list-value">Active</dd></div>
</dl>
</div>
<div class="demo-label">Project metadata</div>
<div class="demo">
<dl class="list">
<div class="list-row"><dt class="list-label">Created</dt><dd class="list-value">2024-01-15</dd></div>
<div class="list-row"><dt class="list-label">Updated</dt><dd class="list-value">2024-06-03</dd></div>
<div class="list-row"><dt class="list-label">Owner</dt><dd class="list-value">Kees van Dijk</dd></div>
<div class="list-row"><dt class="list-label">Files</dt><dd class="list-value">24</dd></div>
</dl>
</div>
</div>
</body>
</html>
