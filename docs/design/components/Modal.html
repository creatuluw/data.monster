<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-md:1.25rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-lg:0 6px 24px oklch(0.22 0.005 250 / 0.12);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--duration-slow:550ms;--max-width:72rem;--leading-relaxed:1.8}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.modal-backdrop{position:fixed;inset:0;background:oklch(0.14 0.01 250 / 0.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity var(--duration-slow) var(--ease-out-expo),visibility var(--duration-slow)}
.modal-backdrop.open{opacity:1;visibility:visible}
.modal{background:var(--color-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-lg);width:90%;max-width:680px;transform:translateY(12px) scale(0.98);transition:transform var(--duration-slow) var(--ease-out-expo)}
.modal-backdrop.open .modal{transform:translateY(0) scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-6);border-bottom:1px solid var(--color-border)}
.modal-header-left{display:flex;align-items:center;gap:var(--space-3)}
.modal-header-ref{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;color:var(--color-accent)}
.modal-title{font-family:var(--font-display);font-size:var(--text-md);font-weight:600;letter-spacing:-0.01em;color:var(--color-text)}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--color-border);border-radius:var(--radius-xs);cursor:pointer;color:var(--color-text-tertiary);transition:color var(--duration-fast) ease,border-color var(--duration-fast) ease,background var(--duration-fast) ease}
.modal-close:hover{color:var(--color-text);border-color:var(--color-border-strong);background:var(--color-surface-sunken)}
.modal-body{padding:var(--space-6);font-size:var(--text-sm);line-height:var(--leading-relaxed);color:var(--color-text-secondary)}
.modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-3);padding:var(--space-4) var(--space-6);border-top:1px dashed var(--color-border)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);font-family:var(--font-body);font-size:var(--text-xs);font-weight:600;line-height:1.4;cursor:pointer;border:1px solid transparent;border-radius:var(--radius-xs);text-decoration:none;transition:transform var(--duration-fast) var(--ease-out-expo),background var(--duration-fast) ease}
.btn:active{transform:scale(0.97)}
.btn:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.btn-primary{background:var(--color-accent);color:var(--color-text-on-accent);border-color:var(--color-accent)}
.btn-primary:hover{background:oklch(0.44 0.14 41)}
.btn-secondary{background:transparent;color:var(--color-text);border-color:var(--color-border-strong)}
.btn-secondary:hover{border-color:var(--color-accent);color:var(--color-accent)}
</style>
</head>
<body>
<div class="page">
<h1>Modal</h1>
<p class="desc">Centered dialog overlay with backdrop blur and smooth animation.</p>
<div class="demo-label">Open modal</div>
<div class="demo">
<button class="btn btn-primary" onclick="openModal()">Open Modal</button>
</div>
</div>

<div class="modal-backdrop" id="modal-bd" onclick="if(event.target===this)closeModal()">
<div class="modal" role="dialog" aria-modal="true">
<div class="modal-header">
<div class="modal-header-left"><span class="modal-header-ref">DIALOG-01</span><h2 class="modal-title">Confirm Action</h2></div>
<button class="modal-close" aria-label="Close modal" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<div class="modal-body"><p>Are you sure you want to proceed with this action? This cannot be undone. Please review the details carefully before confirming.</p></div>
<div class="modal-footer">
<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
<button class="btn btn-primary" onclick="closeModal()">Confirm</button>
</div>
</div>
</div>

<script>
function openModal(){document.getElementById('modal-bd').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modal-bd').classList.remove('open');document.body.style.overflow=''}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()})
</script>
</body>
</html>
