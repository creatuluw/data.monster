<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NodeTree Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-dark:oklch(0.44 0.14 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-border:oklch(0.86 0.006 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-sm:0 1px 2px oklch(0.22 0.005 250 / 0.07);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--duration-base:340ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.tree{font-family:var(--font-mono);font-size:var(--text-sm)}
.tree-node{margin-left:0}
.tree-node.has-children{margin-bottom:2px}
.tree-toggle{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:none;background:transparent;cursor:pointer;color:var(--color-text-tertiary);padding:0;margin-right:var(--space-1);vertical-align:middle;transition:transform var(--duration-fast) var(--ease-out-expo)}
.tree-toggle.expanded{transform:rotate(90deg)}
.tree-toggle:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.tree-label{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-2);border-radius:var(--radius-xs);cursor:default;transition:background var(--duration-fast) ease}
.tree-label:hover{background:var(--color-surface-raised)}
.tree-label.selected{background:var(--color-accent-muted);color:var(--color-accent-dark)}
.tree-children{padding-left:var(--space-6);overflow:hidden;max-height:0;transition:max-height var(--duration-base) var(--ease-out-expo)}
.tree-children.open{max-height:500px}
.tree-icon{width:14px;height:14px;color:var(--color-text-tertiary)}
.tree-node-type{font-size:9px;color:var(--color-text-tertiary);margin-left:var(--space-2)}
.tree-count{font-size:9px;color:var(--color-text-tertiary);background:var(--color-surface-sunken);padding:0 var(--space-1);border-radius:var(--radius-xs);margin-left:auto}
</style>
</head>
<body>
<div class="page">
<h1>NodeTree</h1>
<p class="desc">Hierarchical tree component with expand/collapse, selection, and node counts.</p>
<div class="demo">
<div class="tree">
<div class="tree-node has-children">
<button class="tree-toggle" onclick="toggleNode(this)" aria-label="Toggle"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
<span class="tree-label" onclick="selectNode(this)"><svg class="tree-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> src<span class="tree-count">24</span></span>
<div class="tree-children">
<div class="tree-node has-children">
<button class="tree-toggle" onclick="toggleNode(this)" aria-label="Toggle"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
<span class="tree-label" onclick="selectNode(this)"><svg class="tree-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> lib<span class="tree-count">18</span></span>
<div class="tree-children">
<div class="tree-node"><span class="tree-label" onclick="selectNode(this)"><svg class="tree-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> components<span class="tree-count">10</span></span></div>
<div class="tree-node"><span class="tree-label" onclick="selectNode(this)"><svg class="tree-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> utils<span class="tree-count">5</span></span></div>
</div>
</div>
<div class="tree-node"><span class="tree-label" onclick="selectNode(this)"><svg class="tree-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> app.css<span class="tree-node-type">css</span></span></div>
</div>
</div>
<div class="tree-node has-children">
<button class="tree-toggle" onclick="toggleNode(this)" aria-label="Toggle"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
<span class="tree-label" onclick="selectNode(this)"><svg class="tree-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> static<span class="tree-count">6</span></span>
<div class="tree-children">
<div class="tree-node"><span class="tree-label" onclick="selectNode(this)"><svg class="tree-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> favicon.ico<span class="tree-node-type">image</span></span></div>
</div>
</div>
</div>
</div>
<script>
function toggleNode(btn){btn.classList.toggle('expanded');var children=btn.parentElement.querySelector('.tree-children');if(children)children.classList.toggle('open')}
function selectNode(el){document.querySelectorAll('.tree-label.selected').forEach(function(l){l.classList.remove('selected')});el.classList.add('selected')}
</script>
</div>
</body>
</html>
