<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagination Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-border:oklch(0.86 0.006 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.pagination{display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.pagination-buttons{display:flex;align-items:center;gap:var(--space-1)}
.pagination-btn{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 var(--space-2);font-family:var(--font-body);font-size:var(--text-xs);font-weight:600;color:var(--color-text);background:transparent;border:1px solid var(--color-border);border-radius:var(--radius-xs);cursor:pointer;transition:background var(--duration-fast) ease,color var(--duration-fast) ease,border-color var(--duration-fast) ease}
.pagination-btn:hover:not(:disabled):not(.pagination-active){border-color:var(--color-accent);color:var(--color-accent)}
.pagination-btn:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.pagination-btn:disabled{opacity:0.4;cursor:not-allowed}
.pagination-active{background:var(--color-accent);color:var(--color-text-on-accent);border-color:var(--color-accent)}
.pagination-prev,.pagination-next{font-size:var(--text-sm);padding:0 var(--space-1)}
.pagination-ellipsis{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;font-size:var(--text-sm);color:var(--color-text-tertiary);user-select:none}
.pagination-info{font-family:var(--font-body);font-size:var(--text-xs);color:var(--color-text-secondary)}
</style>
</head>
<body>
<div class="page">
<h1>Pagination</h1>
<p class="desc">Page navigation with ellipsis, prev/next, and range info.</p>

<div class="demo-label">Page 1 of 50 (500 items, 10/page)</div>
<div class="demo" id="pag-demo">
<nav class="pagination" aria-label="Pagination">
<div class="pagination-buttons">
<button class="pagination-btn pagination-prev" disabled aria-label="Previous">&lsaquo;</button>
<button class="pagination-btn pagination-active" aria-current="page">1</button>
<button class="pagination-btn">2</button>
<button class="pagination-btn">3</button>
<button class="pagination-btn">4</button>
<span class="pagination-ellipsis">&hellip;</span>
<button class="pagination-btn">50</button>
<button class="pagination-btn pagination-next" aria-label="Next">&rsaquo;</button>
</div>
<span class="pagination-info">1–10 of 500</span>
</nav>
<p class="desc" style="margin-top:var(--space-6)">Try the interactive version:</p>
<div id="pag-interactive"></div>
</div>
<script>
(function(){
var totalItems=287,perPage=20,totalPages=Math.ceil(totalItems/perPage),cp=1;
function render(){
var start=(cp-1)*perPage+1,end=Math.min(cp*perPage,totalItems);
var pages=[];pages.push(1);
var s=Math.max(2,cp-1),e=Math.min(totalPages-1,cp+1);
if(cp<=3){s=2;e=Math.min(4,totalPages-1)}
else if(cp>=totalPages-2){s=Math.max(totalPages-3,2);e=totalPages-1}
if(s>2)pages.push('e');
for(var i=s;i<=e;i++)pages.push(i);
if(e<totalPages-1)pages.push('e');
pages.push(totalPages);
var h='<div class="pagination-buttons">';
h+='<button class="pagination-btn pagination-prev"'+ (cp<=1?' disabled':'') +' aria-label="Previous" onclick="goTo('+(cp-1)+')">&lsaquo;</button>';
for(var j=0;j<pages.length;j++){
var p=pages[j];
if(p==='e')h+='<span class="pagination-ellipsis">&hellip;</span>';
else h+='<button class="pagination-btn'+(p===cp?' pagination-active':'')+'" onclick="goTo('+p+')">'+p+'</button>';
}
h+='<button class="pagination-btn pagination-next"'+ (cp>=totalPages?' disabled':'') +' aria-label="Next" onclick="goTo('+(cp+1)+')">&rsaquo;</button>';
h+='</div><span class="pagination-info">'+start+'\u2013'+end+' of '+totalItems+'</span>';
document.getElementById('pag-interactive').innerHTML=h;
}
window.goTo=function(p){if(p<1||p>totalPages||p===cp)return;cp=p;render()};
render();
})();
</script>
</div>
</div>
</body>
</html>
