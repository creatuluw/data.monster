<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Searchahead Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-dark:oklch(0.44 0.14 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-placeholder:oklch(0.72 0.008 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-md:0 2px 8px oklch(0.22 0.005 250 / 0.09);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:600px;margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.search-wrap{position:relative}
.search-input-row{display:flex;align-items:center;gap:0;border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);background:var(--color-surface);overflow:hidden;transition:border-color var(--duration-fast) ease,box-shadow var(--duration-fast) ease}
.search-input-row:focus-within{border-color:var(--color-accent);box-shadow:0 0 0 2px var(--color-accent-muted)}
.search-icon{padding:var(--space-2);color:var(--color-text-tertiary);flex-shrink:0}
.search-input{flex:1;padding:var(--space-2) var(--space-3);padding-left:0;border:none;outline:none;background:transparent;font-family:var(--font-body);font-size:var(--text-sm);color:var(--color-text);min-width:0}
.search-input::placeholder{color:var(--color-text-placeholder);font-size:var(--text-xs);font-weight:300}
.search-clear{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:var(--space-2);border:none;background:transparent;cursor:pointer;color:var(--color-text-tertiary);border-radius:50%;transition:color var(--duration-fast) ease,background var(--duration-fast) ease}
.search-clear:hover{color:var(--color-text);background:var(--color-surface-sunken)}
.search-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:2px;background:var(--color-surface);border:1px solid var(--color-accent);border-radius:var(--radius-xs);box-shadow:var(--shadow-md);z-index:100;max-height:300px;overflow-y:auto;display:none}
.search-dropdown.open{display:block}
.search-option{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border:none;background:transparent;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);font-size:var(--text-xs);color:var(--color-text);transition:background var(--duration-fast) ease}
.search-option:hover,.search-option.highlighted{background:var(--color-accent-muted)}
.search-option-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-option-meta{font-family:var(--font-mono);font-size:9px;color:var(--color-text-tertiary)}
.search-hint{font-size:var(--text-xs);color:var(--color-text-tertiary);padding:var(--space-3);text-align:center}
.selected-tags{display:flex;flex-wrap:wrap;gap:var(--space-1);margin-top:var(--space-3)}
.selected-tag{display:inline-flex;align-items:center;gap:4px;padding:2px var(--space-2);background:var(--color-accent-muted);color:var(--color-accent-dark);border:1px solid var(--color-accent-muted);border-radius:var(--radius-xs);font-size:9px;font-weight:600;font-family:var(--font-body)}
.selected-tag-remove{width:12px;height:12px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;color:var(--color-accent-dark);padding:0;opacity:0.6;border-radius:50%}
.selected-tag-remove:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
<h1>Searchahead</h1>
<p class="desc">Search input with dropdown autocomplete, multi-select tags, and keyboard navigation.</p>
<div class="demo-label">Search students</div>
<div class="demo">
<div class="search-wrap" id="sa">
<div class="search-input-row">
<span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
<input class="search-input" id="sa-input" placeholder="Search..." oninput="filterOptions()" onfocus="showDropdown()" onkeydown="handleKey(event)">
<button class="search-clear" onclick="clearSearch()" aria-label="Clear"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<div class="search-dropdown" id="sa-dropdown"></div>
<div class="selected-tags" id="sa-tags"></div>
</div>
</div>
<script>
var allOptions=[{text:'Emma de Vries',meta:'DG-3A'},{text:'Thomas Bakker',meta:'DG-3B'},{text:'Sanne Jansen',meta:'DG-3A'},{text:'Lars de Groot',meta:'DG-3C'},{text:'Mila Visser',meta:'DG-3B'},{text:'Daan Hendriks',meta:'DG-3C'},{text:'Sophie Mulder',meta:'DG-3A'}];
var selected=[],highlighted=-1;
function filterOptions(){
var q=document.getElementById('sa-input').value.toLowerCase();
var filtered=q?allOptions.filter(function(o){return o.text.toLowerCase().includes(q)||o.meta.toLowerCase().includes(q)}):allOptions;
highlighted=-1;
var dd=document.getElementById('sa-dropdown');
var html='';filtered.forEach(function(o,i){if(!selected.find(function(s){return s.text===o.text}))html+='<button class="search-option" onclick="selectOption(\''+o.text+'\',\''+o.meta+'\')"><span class="search-option-text">'+o.text+'</span><span class="search-option-meta">'+o.meta+'</span></button>'});
if(!html)html='<div class="search-hint">No results found</div>';
dd.innerHTML=html;showDropdown();
}
function showDropdown(){document.getElementById('sa-dropdown').classList.add('open')}
function selectOption(text,meta){
selected.push({text:text,meta:meta});renderTags();
document.getElementById('sa-input').value='';document.getElementById('sa-dropdown').classList.remove('open');
}
function removeTag(idx){selected.splice(idx,1);renderTags()}
function renderTags(){
var container=document.getElementById('sa-tags');
container.innerHTML=selected.map(function(s,i){return '<span class="selected-tag">'+s.text+' <button class="selected-tag-remove" onclick="removeTag('+i+')" aria-label="Remove"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>'}).join('');
}
function clearSearch(){document.getElementById('sa-input').value='';document.getElementById('sa-dropdown').classList.remove('open')}
function handleKey(e){
var dd=document.getElementById('sa-dropdown'),items=dd.querySelectorAll('.search-option');
if(e.key==='ArrowDown'){e.preventDefault();highlighted=Math.min(highlighted+1,items.length-1);updateHighlight(items)}
else if(e.key==='ArrowUp'){e.preventDefault();highlighted=Math.max(highlighted-1,0);updateHighlight(items)}
else if(e.key==='Enter'&&highlighted>=0){e.preventDefault();items[highlighted].click()}
else if(e.key==='Escape'){dd.classList.remove('open')}
}
function updateHighlight(items){items.forEach(function(it,i){it.classList.toggle('highlighted',i===highlighted)});if(highlighted>=0)items[highlighted].scrollIntoView({block:'nearest'})}
document.addEventListener('click',function(e){if(!document.getElementById('sa').contains(e.target))document.getElementById('sa-dropdown').classList.remove('open')})
</script>
</div>
</body>
</html>
