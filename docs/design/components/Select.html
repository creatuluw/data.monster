<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-dark:oklch(0.44 0.14 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-placeholder:oklch(0.72 0.008 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-md:0 2px 8px oklch(0.22 0.005 250 / 0.09);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:600px;margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-6)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.field{display:flex;flex-direction:column;gap:var(--space-2)}
.field-label{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.44 0.14 41)}
.field-hint{font-family:var(--font-mono);font-size:9px;color:var(--color-text-tertiary);letter-spacing:0.02em}
.select-wrap{position:relative}
.select-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) var(--space-3);border:1px solid var(--color-border-strong);color:var(--color-text);background:var(--color-surface);border-radius:var(--radius-xs);font-family:var(--font-body);font-size:var(--text-sm);line-height:1.5;min-height:2.3rem;cursor:pointer;transition:border-color var(--duration-fast) ease,box-shadow var(--duration-fast) ease}
.select-trigger:focus-visible{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 2px var(--color-accent-muted)}
.select-value{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-xs)}
.select-placeholder{color:var(--color-text-placeholder);font-size:var(--text-xs);font-weight:300}
.select-icon{flex-shrink:0;margin-left:var(--space-2);color:var(--color-text-tertiary)}
.select-dropdown{position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:var(--color-surface);border:1px solid var(--color-accent);border-radius:var(--radius-xs);z-index:900;box-shadow:var(--shadow-md);display:none;animation:slideDown var(--duration-fast) var(--ease-out-expo) both}
.select-dropdown.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.select-option{display:block;width:100%;padding:var(--space-2) var(--space-3);color:var(--color-text);background:transparent;border:none;cursor:pointer;text-align:left;font-family:var(--font-body);font-size:var(--text-xs);transition:background var(--duration-fast) ease}
.select-option:hover{background:var(--color-accent-dark);color:white}
.select-option.active{color:var(--color-accent)}
</style>
</head>
<body>
<div class="page">
<h1>Select</h1>
<p class="desc">Custom dropdown select component with popover positioning.</p>
<div class="demo">
<div class="field">
<label class="field-label">Role</label>
<div class="select-wrap">
<button class="select-trigger" id="sel-trigger" onclick="toggleSelect('sel-drop',this)" aria-haspopup="listbox" aria-expanded="false">
<span class="select-value select-placeholder" id="sel-value">Choose an option…</span>
<svg class="select-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
</button>
<div class="select-dropdown" id="sel-drop" role="listbox">
<button class="select-option" onclick="selectOption('sel-drop','sel-value','sel-trigger','Admin','Admin')">Admin</button>
<button class="select-option" onclick="selectOption('sel-drop','sel-value','sel-trigger','Editor','Editor')">Editor</button>
<button class="select-option" onclick="selectOption('sel-drop','sel-value','sel-trigger','Viewer','Viewer')">Viewer</button>
<button class="select-option" onclick="selectOption('sel-drop','sel-value','sel-trigger','Guest','Guest')">Guest</button>
</div>
</div>
<span class="field-hint">Select the user's access level</span>
</div>
<p id="sel-feedback" style="font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:var(--space-4)"></p>
</div>
<script>
function toggleSelect(dropId,trigger){var d=document.getElementById(dropId);var isOpen=d.classList.contains('open');document.querySelectorAll('.select-dropdown.open').forEach(function(x){x.classList.remove('open')});document.querySelectorAll('.select-trigger').forEach(function(x){x.setAttribute('aria-expanded','false')});if(!isOpen){d.classList.add('open');trigger.setAttribute('aria-expanded','true')}}
function selectOption(dropId,valId,trigId,value,label){var d=document.getElementById(dropId);var v=document.getElementById(valId);var t=document.getElementById(trigId);v.textContent=label;v.classList.remove('select-placeholder');d.classList.remove('open');t.setAttribute('aria-expanded','false');d.querySelectorAll('.select-option').forEach(function(o){o.classList.remove('active')});event.target.classList.add('active');document.getElementById('sel-feedback').textContent='Selected: '+value}
document.addEventListener('click',function(e){if(!e.target.closest('.select-wrap')){document.querySelectorAll('.select-dropdown.open').forEach(function(x){x.classList.remove('open')});document.querySelectorAll('.select-trigger').forEach(function(x){x.setAttribute('aria-expanded','false')})}})
</script>
</div>
</body>
</html>
