<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-border:oklch(0.86 0.006 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-sm:0 1px 2px oklch(0.22 0.005 250 / 0.07);--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-2);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.spinner-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.spinner-wrap-centered{display:flex;justify-content:center;align-items:center;padding:var(--space-8)}
.spinner{border:2px solid var(--color-border);border-top-color:var(--color-accent);border-radius:50%;animation:spin 1.2s linear infinite}
.spinner-sm{width:14px;height:14px;border-width:2px}
.spinner-md{width:20px;height:20px;border-width:2px}
.spinner-lg{width:32px;height:32px;border-width:3px}
.spinner-xl{width:48px;height:48px;border-width:4px}
.spinner-label{font-size:var(--text-sm);color:var(--color-text-secondary)}
.spinner-tile{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-4) var(--space-6);background:var(--color-surface);box-shadow:var(--shadow-sm)}
.spinner-centered.spinner-tile{padding:var(--space-8) var(--space-6)}
@keyframes spin{to{transform:rotate(360deg)}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}
.flex-row{display:flex;align-items:center;gap:var(--space-6);flex-wrap:wrap}
</style>
</head>
<body>
<div class="page">
<h1>Spinner</h1>
<p class="desc">Circular loading indicator with size variants and optional label.</p>
<div class="demo-label">Sizes</div>
<div class="demo">
<div class="flex-row">
<div class="spinner-wrap"><div class="spinner spinner-sm" role="status"><span class="sr-only">Loading...</span></div></div>
<div class="spinner-wrap"><div class="spinner spinner-md" role="status"><span class="sr-only">Loading...</span></div></div>
<div class="spinner-wrap"><div class="spinner spinner-lg" role="status"><span class="sr-only">Loading...</span></div></div>
<div class="spinner-wrap"><div class="spinner spinner-xl" role="status"><span class="sr-only">Loading...</span></div></div>
</div>
</div>
<div class="demo-label">With label</div>
<div class="demo">
<div class="flex-row">
<div class="spinner-wrap spinner-tile"><div class="spinner spinner-md" role="status"><span class="sr-only">Loading...</span></div><p class="spinner-label">Processing data…</p></div>
</div>
</div>
<div class="demo-label">Centered</div>
<div class="demo">
<div class="spinner-wrap spinner-wrap-centered spinner-tile"><div class="spinner spinner-lg" role="status"><span class="sr-only">Loading...</span></div><p class="spinner-label">Loading page…</p></div>
</div>
</div>
</body>
</html>
