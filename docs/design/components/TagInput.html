<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TagInput Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-dark:oklch(0.44 0.14 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-placeholder:oklch(0.72 0.008 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-sm:0 1px 2px oklch(0.22 0.005 250 / 0.07);--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:600px;margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.tag-input{position:relative}
.tag-input-field{display:flex;flex-wrap:wrap;gap:var(--space-1);padding:var(--space-1) var(--space-2);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);background:var(--color-surface);min-height:36px;align-items:center}
.tag-input-field:focus-within{border-color:var(--color-accent);box-shadow:0 0 0 2px var(--color-accent-muted)}
.tag-chip{display:inline-flex;align-items:center;gap:2px;padding:2px var(--space-2);background:var(--color-accent-muted);color:var(--color-accent-dark);border:1px solid var(--color-accent-muted);border-radius:var(--radius-xs);font-size:var(--text-xs);font-weight:600;font-family:var(--font-body);line-height:1.4}
.tag-remove{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:none;background:transparent;color:var(--color-accent-dark);cursor:pointer;border-radius:50%;padding:0;opacity:0.6;transition:opacity var(--duration-fast) ease}
.tag-remove:hover{opacity:1}
.tag-text-input{flex:1;min-width:80px;border:none;outline:none;background:transparent;font-family:var(--font-body);font-size:var(--text-sm);color:var(--color-text);padding:0;line-height:1.5}
.tag-text-input::placeholder{color:var(--color-text-placeholder);font-size:var(--text-xs);font-weight:300}
.tag-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--color-surface);border:1px solid var(--color-border);border-radius:0 0 var(--radius-xs) var(--radius-xs);box-shadow:var(--shadow-sm);max-height:150px;overflow-y:auto;z-index:10;display:none}
.tag-suggestions.open{display:block}
.tag-suggestion{display:block;width:100%;text-align:left;padding:var(--space-1) var(--space-2);border:none;background:transparent;color:var(--color-text);font-family:var(--font-body);font-size:var(--text-xs);cursor:pointer;transition:background var(--duration-fast) ease}
.tag-suggestion:hover{background:var(--color-surface-sunken)}
</style>
</head>
<body>
<div class="page">
<h1>TagInput</h1>
<p class="desc">Input field for adding/removing tags with autocomplete suggestions.</p>
<div class="demo-label">Add tags (type and press Enter)</div>
<div class="demo">
<div class="tag-input" id="ti">
<div class="tag-input-field" id="ti-field">
<input type="text" class="tag-text-input" id="ti-input" placeholder="Tag toevoegen…" onkeydown="handleTagKey(event)" onfocus="showSuggestions()" onblur="hideSuggestions()">
</div>
<div class="tag-suggestions" id="ti-suggestions">
<button class="tag-suggestion" onclick="addTag(this.textContent)">JavaScript</button>
<button class="tag-suggestion" onclick="addTag(this.textContent)">TypeScript</button>
<button class="tag-suggestion" onclick="addTag(this.textContent)">Svelte</button>
<button class="tag-suggestion" onclick="addTag(this.textContent)">CSS</button>
<button class="tag-suggestion" onclick="addTag(this.textContent)">HTML</button>
<button class="tag-suggestion" onclick="addTag(this.textContent)">Python</button>
</div>
</div>
</div>
<script>
var tags=[];
function addTag(tag){
tag=tag.trim();
if(!tag||tags.includes(tag))return;
tags.push(tag);
renderTags();
document.getElementById('ti-input').value='';
}
function removeTag(index){
tags.splice(index,1);
renderTags();
}
function renderTags(){
var field=document.getElementById('ti-field');
var chips=field.querySelectorAll('.tag-chip');
chips.forEach(function(c){c.remove()});
tags.forEach(function(t,i){
var chip=document.createElement('span');
chip.className='tag-chip';
chip.innerHTML=t+' <button class="tag-remove" onclick="removeTag('+i+')" aria-label="Remove '+t+'"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
field.insertBefore(chip,field.lastElementChild);
});
}
function handleTagKey(e){
if(e.key==='Enter'){e.preventDefault();addTag(e.target.value)}
else if(e.key==='Backspace'&&!e.target.value&&tags.length>0){tags.pop();renderTags()}
}
function showSuggestions(){document.getElementById('ti-suggestions').classList.add('open')}
function hideSuggestions(){setTimeout(function(){document.getElementById('ti-suggestions').classList.remove('open')},150)}
</script>
</div>
</body>
</html>
