<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestResultDrawer Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-accent-dark:oklch(0.44 0.14 41);--color-accent-muted:oklch(0.93 0.03 41);--color-surface:white;--color-surface-raised:oklch(0.96 0.005 250);--color-surface-sunken:oklch(0.935 0.006 250);--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-border:oklch(0.86 0.006 250);--color-border-strong:oklch(0.72 0.012 250);--color-success:oklch(0.68 0.14 160);--color-warning:oklch(0.76 0.13 80);--color-danger:oklch(0.58 0.17 22);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-md:1.25rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--gutter:clamp(1rem,3vw,2rem);--duration-fast:180ms;--leading-relaxed:1.8;--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:600px;margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-6);border-bottom:1px solid var(--color-border);background:var(--color-surface)}
.drawer-title{font-family:var(--font-display);font-size:var(--text-md);font-weight:600;color:var(--color-text)}
.drawer-ref{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;color:var(--color-accent)}
.drawer-body{padding:var(--space-6);font-size:var(--text-sm);color:var(--color-text-secondary)}
.result-summary{display:flex;gap:var(--space-6);margin-bottom:var(--space-6)}
.result-stat{text-align:center;padding:var(--space-4);background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius-sm);flex:1}
.result-stat-value{font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;color:var(--color-text)}
.result-stat-label{font-family:var(--font-mono);font-size:9px;letter-spacing:0.06em;color:var(--color-text-tertiary);margin-top:var(--space-1)}
.result-pass{color:var(--color-success)}
.result-warn{color:var(--color-warning)}
.result-fail{color:var(--color-danger)}
.test-item{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-xs);margin-bottom:var(--space-2);background:var(--color-surface)}
.test-item-name{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text)}
.test-item-status{font-family:var(--font-body);font-size:9px;font-weight:600;padding:1px var(--space-2);border-radius:var(--radius-xs)}
.status-pass{background:oklch(0.95 0.03 160);color:oklch(0.4 0.1 160)}
.status-fail{background:oklch(0.95 0.03 22);color:oklch(0.38 0.12 22)}
.section-title{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:var(--space-3)}
</style>
</head>
<body>
<div class="page">
<h1>TestResultDrawer</h1>
<p class="desc">Drawer displaying test results with summary stats and individual test outcomes.</p>
<div class="demo">
<div class="drawer-header"><div><span class="drawer-ref">TEST-2024-032</span><h2 class="drawer-title">Test Results</h2></div></div>
<div class="drawer-body">
<div class="result-summary">
<div class="result-stat"><div class="result-stat-value result-pass">24</div><div class="result-stat-label">Passed</div></div>
<div class="result-stat"><div class="result-stat-value result-fail">3</div><div class="result-stat-label">Failed</div></div>
<div class="result-stat"><div class="result-stat-value result-warn">1</div><div class="result-stat-label">Skipped</div></div>
</div>
<div class="section-title">Test Details</div>
<div class="test-item"><span class="test-item-name">auth/login.test.ts</span><span class="test-item-status status-pass">Pass</span></div>
<div class="test-item"><span class="test-item-name">student/create.test.ts</span><span class="test-item-status status-pass">Pass</span></div>
<div class="test-item"><span class="test-item-name">case/update.test.ts</span><span class="test-item-status status-fail">Fail</span></div>
<div class="test-item"><span class="test-item-name">group/delete.test.ts</span><span class="test-item-status status-fail">Fail</span></div>
<div class="test-item"><span class="test-item-name">report/generate.test.ts</span><span class="test-item-status status-pass">Pass</span></div>
</div>
</div>
</div>
</body>
</html>
