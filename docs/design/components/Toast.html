<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toast Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-surface:white;--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-border:oklch(0.86 0.006 250);--color-success:oklch(0.68 0.14 160);--color-warning:oklch(0.76 0.13 80);--color-danger:oklch(0.58 0.17 22);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-sm:0 1px 2px oklch(0.22 0.005 250 / 0.07);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--duration-fast:180ms;--duration-slow:550ms;--duration-base:340ms;--max-width:72rem;--leading-normal:1.6}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);background:var(--color-surface);margin-bottom:var(--space-8)}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.toast-area{display:flex;flex-direction:column;gap:var(--space-3);position:relative}
.toast{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);padding-right:var(--space-2);background:var(--color-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-sm);min-width:200px;max-width:320px;transform:translateX(0);opacity:1;transition:transform var(--duration-slow) var(--ease-out-expo),opacity var(--duration-slow) var(--ease-out-expo);position:relative;overflow:hidden;animation:slideIn var(--duration-slow) var(--ease-out-expo) both}
.toast.dismissing{transform:translateX(110%);opacity:0}
.toast-indicator{width:2px;align-self:stretch;flex-shrink:0}
.toast-success .toast-indicator{background:var(--color-success)}
.toast-warning .toast-indicator{background:var(--color-warning)}
.toast-danger .toast-indicator{background:var(--color-danger)}
.toast-default .toast-indicator{background:var(--color-accent)}
.toast-body{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.toast-title{font-family:var(--font-body);font-size:var(--text-xs);font-weight:600;color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast-message{font-size:var(--text-xs);line-height:var(--leading-normal);color:var(--color-text-secondary)}
.toast-close{width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--color-text-tertiary);flex-shrink:0;transition:color var(--duration-fast) ease}
.toast-close:hover{color:var(--color-text)}
.toast-progress{position:absolute;bottom:0;left:0;height:1px;background:var(--color-accent);transition:width linear}
.btn-trigger{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);font-family:var(--font-body);font-size:var(--text-xs);font-weight:600;line-height:1.4;cursor:pointer;border:1px solid var(--color-accent);border-radius:var(--radius-xs);background:var(--color-accent);color:oklch(0.97 0.005 250);transition:transform var(--duration-fast) var(--ease-out-expo)}
.btn-trigger:active{transform:scale(0.97)}
.btn-trigger:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.flex-wrap{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-4)}
</style>
</head>
<body>
<div class="page">
<h1>Toast</h1>
<p class="desc">Notification toast with auto-dismiss, progress bar, and variant styles.</p>
<div class="demo-label">Trigger toasts</div>
<div class="demo">
<div class="flex-wrap">
<button class="btn-trigger" onclick="showToast('default','Item saved','Your changes have been saved successfully.')">Default</button>
<button class="btn-trigger" onclick="showToast('success','Upload complete','All 24 files uploaded successfully.')" style="background:var(--color-success);border-color:var(--color-success)">Success</button>
<button class="btn-trigger" onclick="showToast('warning','Storage low','You have 5% storage remaining.')" style="background:var(--color-warning);border-color:var(--color-warning);color:var(--color-text)">Warning</button>
<button class="btn-trigger" onclick="showToast('danger','Error','Failed to connect to the server.')" style="background:var(--color-danger);border-color:var(--color-danger)">Danger</button>
</div>
<div class="toast-area" id="toast-container"></div>
</div>
<script>
function showToast(variant,title,message){
var container=document.getElementById('toast-container');
var toast=document.createElement('div');
toast.className='toast toast-'+variant;
toast.innerHTML='<div class="toast-indicator"></div><div class="toast-body"><span class="toast-title">'+title+'</span>'+(message?'<span class="toast-message">'+message+'</span>':'')+'</div><button class="toast-close" onclick="dismissToast(this.parentElement)" aria-label="Dismiss"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="toast-progress" style="width:100%"></div>';
container.appendChild(toast);
var progress=toast.querySelector('.toast-progress');
var start=Date.now(),duration=4500;
function tick(){var elapsed=Date.now()-start;var pct=Math.max(0,100-(elapsed/duration)*100);progress.style.width=pct+'%';if(pct>0)requestAnimationFrame(tick)}
requestAnimationFrame(tick);
setTimeout(function(){dismissToast(toast)},duration);
}
function dismissToast(toast){
toast.classList.add('dismissing');
setTimeout(function(){toast.remove()},550);
}
</script>
</div>
</body>
</html>
