<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--color-accent:oklch(0.69 0.16 41);--color-surface:white;--color-text:oklch(0.14 0.01 250);--color-text-secondary:oklch(0.4 0.012 250);--color-text-tertiary:oklch(0.58 0.01 250);--color-text-on-accent:oklch(0.97 0.005 250);--color-border:oklch(0.86 0.006 250);--font-display:"Source Serif 4",serif;--font-body:"Manrope",sans-serif;--font-mono:"Geist Mono",monospace;--text-xs:0.6875rem;--text-sm:0.8125rem;--text-base:1rem;--text-lg:1.563rem;--text-2xl:2.441rem;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--radius-xs:2px;--radius-sm:3px;--shadow-md:0 2px 8px oklch(0.22 0.005 250 / 0.09);--gutter:clamp(1rem,3vw,2rem);--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--max-width:72rem}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.6;color:var(--color-text);background:var(--color-surface);padding:var(--space-12) var(--gutter)}
.page{max-width:var(--max-width);margin:0 auto}
h1{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.03em;color:var(--color-text);margin-bottom:var(--space-2)}
p.desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:var(--space-8)}
.demo{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-12);background:var(--color-surface);margin-bottom:var(--space-8);display:flex;align-items:center;justify-content:center;gap:var(--space-12);flex-wrap:wrap}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:var(--space-4);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.tooltip-wrap{position:relative;display:inline-flex}
.tooltip{position:absolute;z-index:200;padding:var(--space-1) var(--space-2);background:var(--color-text);color:var(--color-text-on-accent);font-family:var(--font-body);font-size:9px;font-weight:500;line-height:1.5;letter-spacing:0.01em;white-space:nowrap;border-radius:var(--radius-xs);box-shadow:var(--shadow-md);pointer-events:none;opacity:0;transition:opacity 120ms var(--ease-out-expo)}
.tooltip-wrap:hover .tooltip{opacity:1}
.tooltip-top{bottom:calc(100% + 6px);left:50%;transform:translateX(-50%)}
.tooltip-bottom{top:calc(100% + 6px);left:50%;transform:translateX(-50%)}
.tooltip-left{right:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.tooltip-right{left:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.trigger-btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);font-family:var(--font-body);font-size:var(--text-xs);font-weight:600;cursor:pointer;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:var(--color-surface);color:var(--color-text);transition:border-color 180ms ease}
.trigger-btn:hover{border-color:var(--color-accent)}
</style>
</head>
<body>
<div class="page">
<h1>Tooltip</h1>
<p class="desc">Hover tooltip with configurable position (top, bottom, left, right).</p>
<div class="demo-label">Hover the buttons to see tooltips</div>
<div class="demo">
<span class="tooltip-wrap"><button class="trigger-btn">Top<span class="tooltip tooltip-top">Tooltip on top</span></button></span>
<span class="tooltip-wrap"><button class="trigger-btn">Bottom<span class="tooltip tooltip-bottom">Tooltip on bottom</span></button></span>
<span class="tooltip-wrap"><button class="trigger-btn">Left<span class="tooltip tooltip-left">Tooltip on left</span></button></span>
<span class="tooltip-wrap"><button class="trigger-btn">Right<span class="tooltip tooltip-right">Tooltip on right</span></button></span>
</div>
</div>
</body>
</html>
