	const start = { x: parseFloat(cursor.style.left || String(innerWidth / 2)) + 11, y: parseFloat(cursor.style.top || String(innerHeight / 2)) + 11 };
	const dx = doel.x - start.x, dy = doel.y - start.y;
	const afstand = Math.hypot(dx, dy);
	if (afstand < 2) { cursor.style.left = doel.x - 11 + 'px'; cursor.style.top = doel.y - 11 + 'px'; return; }

	const boog = (Math.random() - 0.5) * Math.min(70, afstand * 0.3);
	const hoekpunt = { x: (start.x + doel.x) / 2 + boog * 0.6, y: (start.y + doel.y) / 2 - boog };
