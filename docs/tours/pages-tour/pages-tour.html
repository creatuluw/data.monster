const STAPPEN = [{"f":"data","cap":"First table","tekst":"Pages v1 has no page list or builder yet. The dashboard is generated automatically from the first table in the workspace; the tour seeds a small demo table that sorts first.","tour":["demo-table"]},{"f":"dashboard","cap":"Auto dashboard","tekst":"Pages opens as a ready-made view: two clickable bar charts over the table's text and numeric columns, a filter bar, and the raw table underneath.","tour":["chart-region","chart-category","table-title"]},{"f":"dashboard","cap":"Click a bar","tekst":"Clicking the top region bar selects it and fires a re-query across both charts and the table.","anchor":"row-region","act":"click","klaar":"Bar clicked, re-query fired."},{"f":"after-click","cap":"Honest v1","tekst":"The selection flashes as a filter chip, but v1 then resets it: the refresh rebuilds the chart state and drops the filter. Selections that stick are on the roadmap.","tour":["filter-bar"]},{"f":"after-click","cap":"Chart detail","tekst":"Each chart card opens its own full-height detail view through the panel button in the card header.","tour":["chart-action"]},{"f":"after-click","cap":"Open it","tekst":"The region chart opens on its own route, /pages/chart/region.","anchor":"chart-action","act":"click","klaar":"Chart detail open."},{"f":"detail","cap":"Detail view","tekst":"Same bar chart, full width, plus a right-hand drawer. The drawer is where chart configuration will live; v1 says so itself: configuration coming soon.","tour":["drawer-title","drawer-empty","breadcrumb-pages"]},{"f":"detail","cap":"Back","tekst":"The Pages breadcrumb (or the arrow next to it) returns to the dashboard.","anchor":"breadcrumb-pages","act":"click","klaar":"Back on the dashboard."},{"f":"back","cap":"Wrap-up","tekst":"That is Pages today: automatic charts over the first table, live re-querying, a detail view and the table underneath. The page builder with bar, heatmap and table blocks is still roadmap.","tour":["chart-region","table-title"]}];

const stage = document.getElementById('stage');
const wrap = document.getElementById('stage-wrap');
const cursor = document.getElementById('cursor');

// ---- frames als gestapelde iframes (srcdoc), alleen de actieve zichtbaar ----
const iframes = [];
let eerste = true;
for (const f of FRAMES) {
	const doc = f.html.replace(/<!--CSS(\d+)-->/, (_, i) => '<style>' + CSS[+i] + '</style>');
	const ifr = document.createElement('iframe');
	ifr.className = 'frame' + (eerste ? ' actief' : '');
	ifr.srcdoc = doc;
	stage.appendChild(ifr);
	iframes.push(ifr);
	eerste = false;
	ifr.addEventListener('load', () => {
		try {
			herstelScroll(ifr, f.scrolls);
			// voorkom dat een kijk-klik de frame wegnavigeert
			ifr.contentDocument.addEventListener('click', (e) => {
				const a = e.target.closest && e.target.closest('a');
				if (a) e.preventDefault();
			});
		} catch (e) {}
	});
}
function herstelScroll(ifr, scrolls) {
	for (const s of scrolls || []) {
		let el = ifr.contentDocument.body;
		for (const idx of s.path) el = el.children[idx];
		if (el) { el.scrollTop = s.top; el.scrollLeft = s.left; }
	}
}
let actief = 0;
function toonFrame(i) {
	iframes[actief].classList.remove('actief');
	actief = i;
	iframes[actief].classList.add('actief');
}

// ---- schaal naar venster ----
function schaal() {
	const s = Math.min((innerWidth - 48) / 1440, (innerHeight - 48) / 900);
	stage.style.transform = 'scale(' + Math.min(s, 1.05) + ')';
}
addEventListener('resize', schaal); schaal();

// ---- cursor naar element in actieve frame ----
function elementVoor(anchor) {
	return iframes[actief].contentDocument.querySelector('[data-demo-anchor="' + anchor + '"]');
}
function doelPositie(el) {
	const r = el.getBoundingClientRect();
	const fr = iframes[actief].getBoundingClientRect();
	const k = fr.width / (iframes[actief].offsetWidth || 1440) || 1;
	return { x: fr.left + (r.left + r.width / 2) * k, y: fr.top + (r.top + r.height / 2) * k };
}
let glijdId = 0;
async function cursorNaar(el) {
	const doel = doelPositie(el);
	const start = { x: parseFloat(cursor.style.left || String(innerWidth / 2)) + 11, y: parseFloat(cursor.style.top || String(innerHeight / 2)) + 11 };
	const dx = doel.x - start.x, dy = doel.y - start.y;
	const afstand = Math.hypot(dx, dy);
	if (afstand < 2) { cursor.style.left = doel.x - 11 + 'px'; cursor.style.top = doel.y - 11 + 'px'; return; }
	const duur = Math.min(1400, Math.max(550, afstand * 1.6));
	const boog = (Math.random() - 0.5) * Math.min(70, afstand * 0.3);
	const hoekpunt = { x: (start.x + doel.x) / 2 + boog * 0.6, y: (start.y + doel.y) / 2 - boog };
	const id = ++glijdId;
	let verstreken = 0, vorige = performance.now();
	await new Promise((res) => {
		function tik(t) {
			if (id !== glijdId) return res();
			if (!pauze) verstreken += Math.min(64, t - vorige) * snelheid;
			vorige = t;
			const p = Math.min(1, verstreken / duur);
			const v = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; // ease-in-out: traag op gang, uitrollen naar het doel
			const qx = (1 - v) * (1 - v) * start.x + 2 * (1 - v) * v * hoekpunt.x + v * v * doel.x;
			const qy = (1 - v) * (1 - v) * start.y + 2 * (1 - v) * v * hoekpunt.y + v * v * doel.y;
			if (p < 1) {
				cursor.style.left = qx - 11 + (Math.random() - 0.5) * 1.2 + 'px'; // lichte handbeef
				cursor.style.top = qy - 11 + (Math.random() - 0.5) * 1.2 + 'px';
				requestAnimationFrame(tik);
			} else {
				cursor.style.left = doel.x - 11 + 'px'; // laatste frame exact op het doel
				cursor.style.top = doel.y - 11 + 'px';
				res();
			}
		}
		requestAnimationFrame(tik);
	});
}
function flits(el) {
	const oud = el.style.boxShadow;
	el.style.boxShadow = '0 0 0 3px rgba(255,161,0,.9)';
	el.style.borderRadius = el.style.borderRadius || '6px';
	setTimeout(() => (el.style.boxShadow = oud), 380);
}

// ---- motor ----
let runId = 0, pauze = false, snelheid = 1;
const CANCEL = Symbol('cancel');
function slaap(ms) {
	const id = runId;
	return new Promise((res, rej) => {
		let gewacht = 0;
		const tik = () => {
			if (id !== runId) return rej(CANCEL);
			if (gewacht >= ms) return res();
			if (!pauze) gewacht += 50 * snelheid;
			setTimeout(tik, 50);
		};
		tik();
	});
}
async function klik(el) {
	await cursorNaar(el);
	await slaap(450);
	cursor.classList.add('klik');
	flits(el);
	await slaap(200);
	cursor.classList.remove('klik');
	await slaap(500);
}
async function typIn(el, tekst) {
	await cursorNaar(el);
	await slaap(350);
	cursor.classList.add('klik');
	el.focus();
	cursor.classList.remove('klik');
	el.value = '';
	for (const ch of tekst) {
		if (runId !== myRunId) throw CANCEL;
		el.value += ch;
		await new Promise((r) => setTimeout(r, Math.max(24, (55 + Math.random() * 45) / snelheid)));
	}
}

const dots = document.getElementById('dots');
const cap = document.getElementById('stap-cap');
STAPPEN.forEach(() => dots.appendChild(Object.assign(document.createElement('div'), { className: 'stap-dot' })));
const dotEls = [...dots.children];
function zetStap(i) {
	dotEls.forEach((d, j) => (d.className = 'stap-dot' + (j < i ? ' klaar' : j === i ? ' actief' : '')));
	cap.textContent = STAPPEN[i]?.cap ?? '';
	document.getElementById('ondertitel-tekst').textContent = STAPPEN[i]?.tekst ?? '';
	const kl = document.getElementById('ondertitel-klaar');
	kl.textContent = '';
	kl.style.opacity = '0';
}
function toonKlaar(tekst) {
	const kl = document.getElementById('ondertitel-klaar');
	kl.textContent = '✓ ' + tekst;
	kl.style.opacity = '1';
}

let myRunId = 0;
async function speel() {
	const id = ++runId; myRunId = id;
	pauze = false; document.getElementById('pauze-tekst').textContent = 'Pause';
	document.getElementById('eind').classList.remove('open');
	cursor.style.transition = 'none';
	cursor.style.left = innerWidth / 2 + 'px'; cursor.style.top = innerHeight / 2 + 'px';
	void cursor.offsetWidth; cursor.style.transition = 'none'; glijdId++;
	toonFrame(0);
	try {
		for (let i = 0; i < STAPPEN.length; i++) {
			const s = STAPPEN[i];
			if (runId !== id) throw CANCEL;
			zetStap(i);
			toonFrame(FRAMES.findIndex((f) => f.name === s.f));
			await slaap(1500);
			if (s.tour) {
				for (const a of s.tour) {
					const el = elementVoor(a);
					if (el) { await cursorNaar(el); await slaap(650); }
				}
			}
			if (s.anchor) {
				const el = elementVoor(s.anchor);
				if (el) {
					if (s.act === 'type') { await typIn(el, s.text); await slaap(600); }
					else await klik(el);
				}
			}
			if (s.klaar) toonKlaar(s.klaar);
			await slaap(s.klaar ? 2200 : 1100);
		}
		zetStap(STAPPEN.length);
		await slaap(900);
		document.getElementById('eind-tekst').textContent = "Pages v1: an automatic two-chart dashboard over the workspace's first table, with a chart detail view and the raw table below; the page builder itself is roadmap.";
		document.getElementById('eind').classList.add('open');
	} catch (e) {
		if (e !== CANCEL) throw e;
	}
}
document.getElementById('btn-restart').onclick = speel;
document.getElementById('btn-opnieuw').onclick = speel;
document.getElementById('btn-pauze').onclick = () => {
	pauze = !pauze;
	document.getElementById('pauze-tekst').textContent = pauze ? 'Resume' : 'Pause';
};
document.getElementById('snelheid').onchange = (e) => (snelheid = Number(e.target.value));
// start pas als frame 0 geladen is
const startZodraGeladen = setInterval(() => {
	if (iframes[0]?.contentDocument?.readyState === 'complete') { clearInterval(startZodraGeladen); speel(); }
}, 200);
