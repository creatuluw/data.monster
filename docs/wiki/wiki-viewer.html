# Central-charts v1 scope: bar + heatmap + table blocks; master items and auto-JOIN deferred

## Context

The central reusable-chart build (report pages: charts + blocks on a 12-col grid, dual-mode editor) starts from \`.specs/central-charts/spec.md\` — 13 FRs in 5 phases. The interview had already locked Q3–Q16 (spec format, expressions-as-measures, master items, auto-JOIN, query engine, option panels, cross-filter, tooltips, shared colors, grid, annotations, routes). This decision records the **v1 scope calls** made while writing the spec (reported to the user for veto, none vetoed at time of writing).

## Choice — v1 ships bar chart, heatmap, and table as the first page objects

Plus a text block. Six scope calls:

1. **Master items + relationship auto-JOIN deferred** to the next phase. v1 uses inline expressions only; a \`ref\` field is reserved in the spec types so master items slot in later without a breaking change.
2. **Annotations v1 = \`ruleY\` on bar only** — one mark from the Q15 basic-marks whitelist; heatmap opts out; other types additive later.
3. **Text block included** — locked in Q14-B and nearly free.
4. **Old draft \`/pages\` is replaced**; top-level \`BarChart.svelte\` and the \`pages - Copy\` route retired (FR-13 cleanup).
5. **No new dependencies** — hand-rolled spec validator, no zod.
6. **Table block = plain query rows** — no aggregation, limit 50, respects cross-filter selection.

## Alternatives considered

- Building master items + auto-JOIN now (rejected: biggest risk surface, delays first renderable page).
- Richer annotation set from day one (rejected: per-type whitelisting makes it additive; ruleY proves the pipeline).
- zod for spec validation (rejected: adds a dependency for a schema we own end-to-end).

## Consequences

- First user-visible page can be composed from bar + heatmap + table + text on the grid.
- The \`ref\` reservation means master-item adoption later is non-breaking.
- Phase 5 explicitly deletes the draft \`/pages\` and the copied route — no legacy page format survives.

# Consolidate chart engines to Picasso.js + LayerChart, drop echarts/observable/svelteplot

## Context

Labs (\`/labs\`) originally hosted five chart-engine experiments: ECharts, Observable (Plot), SveltePlot, Picasso.js, and chart-lib (LayerChart). Each only had a bar chart, so comparisons were shallow and maintenance was spread across five stacks (~2,900 lines of lab code for three of them alone).

## Decision

Consolidate down to **two engines**:

1. **Picasso.js** (\`/labs/picasso-charts\`)
2. **LayerChart / chart-lib** (\`/labs/chart-lib\`)

Deleted entirely: \`echarts-charts/\`, \`observable-charts/\`, \`svelteplot-charts/\` routes and \`ObservableBarChartCanvas.svelte\`. Both surviving engines now cover **four chart types each** — bar, line/area, pie/donut, scatter — via paired canvas components (\`PicassoBarChartCanvas\`, \`PicassoLineAreaChartCanvas\`, \`PicassoPieDonutCanvas\`, \`PicassoScatterCanvas\` and the non-prefixed LayerChart equivalents) exported from \`src/lib/charts/index.ts\`.

## Alternatives considered

- Keep all five engines with one chart type each — rejected: shallow comparisons, 5× maintenance.
- Pick one engine now — rejected: the Labs comparison between Picasso.js (canvas control, custom interaction) and LayerChart (Svelte-native composition) is still the point of the experiment.

## Consequences

- ~3,400 lines of lab/chart code removed; new chart types added to both survivors.
- \`docs/src/lib/charts/svelteplot/\` reference components also deleted.
- Future chart-type work goes into both engines in parallel so the comparison stays fair.

# Labs chart catalog mirrors theunspokenpitch.com — scaffolded placeholder-first

## Context

Labs (\`/labs\`) hosts chart-engine experiments. Earlier decision [[labs-per-chart-type]] organized Labs as one card per chart type, with the heatmap built first on SveltePlot. The user then asked to add "the missing charts found in https://www.theunspokenpitch.com/charts" — a site listing 30 chart types.

## Decision

Adopt that site's 30-type list as the definitive Labs catalog and **scaffold every route and card immediately, placeholder-first**:

- Each type gets a route under \`src/routes/labs/<name>/\` and a card in the Labs grid (site order), each with a distinct lucide icon.
- Types without a real implementation render the shared [[labs-placeholder]] component ("Placeholder — coming soon.").
- 5 types already existed (line, area, scatter, bar, sankey — themselves placeholders); 25 were added (pie, venn, concentric, circular, bubble, bubble race, sunburst, fan, windrose, tape, gantt, tree map, grid, periodic table, arc, chord, radar, polar grid, spiral, timeline, flow chart, binary tree, mind map, decision tree, block scheme), plus parallel-coordinates — 32 routes total, all cards ↔ routes match.
- Real charts are then built one at a time on the shared reusable-chart fundament ([[labs-charts-reusable-fundament]]), replacing the placeholder. Card descriptions are written when the chart is built.

## Alternatives considered

- Only add a route when its chart is actually implemented — rejected: the catalog acts as a visible roadmap and keeps cards ↔ routes in sync from day one.

## Consequences

30 of 32 routes are placeholders awaiting real implementations on [[svelteplot-sole-chart-engine]] (heatmap and horizontal bar chart are built). When building a chart, swap \`LabsPlaceholder\` for the real component and add the card description.

# Labs goes per-chart-type; first chart (heatmap) built on SveltePlot

## Context

## Decision

1. \`/labs\` index shows **one card per chart type** (no library cards, no showcase link). First card: Heatmap → \`/labs/heatmap\`.
2. The heatmap was **ported as-is from the kees.pippeloi.nl reference** using SveltePlot — not rebuilt in Picasso.js/LayerChart. SveltePlot 0.14.2 is still a dependency in \`package.json\` (the earlier consolidation removed lab routes, not the dependency), and version parity with the reference (same svelteplot 0.14.2, same Tailwind 4) made the port the cheapest correct move.
3. Per-type components live in \`src/lib/components/\` (reusable, e.g. \`Heatmap.svelte\`), with a playground route under \`/labs/<type>\` on synthetic data.

## Alternatives considered

- Keep the Picasso.js vs LayerChart engine comparison and build the heatmap twice — rejected: Labs' purpose changed from comparing engines to building a chart-type library.
- Rebuild the heatmap in Picasso.js/LayerChart — rejected for v1: the reference port is free; engine choice per type stays open.

## Consequences

- Old engine subroutes (\`/labs/picasso-charts\`, \`/labs/chart-lib\`, \`/labs/unovis-charts\`, \`/labs/charts\`) are **unlinked but still on disk** — delete when the per-type structure proves out.

# Q6 locked: workspace-level master-item library (stable ids) with explicit table binding; Q7 open on binding depth

## Context

Continuation of the 2026-09-15 chart-spec/report-page design interview. Q5 ([[measures-dimensions-are-duckdb-expressions-not-column-agg-su]]) settled measures/dimensions as arbitrary DuckDB expression strings and left **Q6 open**: where the master-item library (reusable dimensions/measures) lives.

The user answered **A** to Q6 and added a requirement: *each measure/dimension is associated with the table/data model it was created for, and this needs smart logic.*

## Choice

**A locked — workspace-level master library, plus explicit table binding:**

- Master items live workspace-level in the internal DB (à la \`d8a_monster_master_items\`), **referenced by stable id** from chart specs — renames propagate; deletion surfaces a "missing master item" state instead of silently breaking.
- Every master item carries a **binding to the table/data model it was created for** (e.g. \`table: "bookings"\`). Binding is explicit metadata on the item, not inferred.

## Q7 open — how the binding drives chart item availability ("smart logic")

- **A) Strict table matching** — a chart on table X sees exactly the items bound to X; save-time validation parses the expression's columns against that table. Simple, siloed.
- **B) Table matching + relationship graph** — chart on X offers items from X **and tables related via the table-relationships model** (existing PRD); picking an item from a related table makes the chart's query auto-\`JOIN\` along the declared relationship (\`bookings ⋈ clients\`). Qlik-association feel.
- **C) Inference-first** — no explicit binding; parse expressions and match against all schemas (ambiguities → user resolves). Most "smart", least predictable — renames or shared column names shift associations silently.

**Assistant lean: B** — it reuses the table-relationships PRD as the source of truth for "smart" instead of inventing inference magic, and keeps the explicit binding greppable in the spec.

## Consequences

- The master library schema needs at minimum: \`{ id, label, expr, fmt, table }\`.
- Table-relationships (\`.prds/table-relationships\`) becomes a load-bearing dependency of chart item availability if B is picked.
- Chart SQL generation gains a JOIN-planning responsibility for cross-table items under B.

## Source

- Design interview turn, 2026-09-15 (user's Q6 answer "A + table binding with smart logic"; Q7 posed with lean B).

# Measures/dimensions are DuckDB expressions, not column+agg sugar (Q5, settled)

## Context

During the 2026-09-15 report-page/chart-spec design interview, the user asked for Qlik Sense-style analysis: expressions like \`sum(if(type = 'class', hours))\` instead of picking a column + aggregation, plus reusable **master dimensions/measures** they define once and customize, then add to any chart.

Related: [[two-surface-report-page-format]] (the spec document this feeds into) and [[chart-authoring-two-surfaces-serializable-spec]].

## Choice

**Measures and dimensions are arbitrary DuckDB expression strings, not \`{col, agg}\` sugar.**

- A measure = \`{ label: "Class hours", expr: "sum(if(type = 'class', hours))", fmt: "..." }\` — any valid DuckDB expression.
- The UI's column/agg dropdowns are **autocomplete sugar that writes expressions**; the stored chart spec always holds the expression string.
- Chart templates slot expressions into generated SQL: \`SELECT {{dimensions}}, {{measures}} ... GROUP BY {{dimensions}}\`.

## Alternatives considered

- Structured \`{column, aggregation}\` model — rejected: cannot express conditionals, arithmetic, or multi-column measures like \`sum(if(...))\`; the user explicitly needs them.
- Expression-only UI (no dropdowns) — rejected as UX: dropdowns stay as sugar, but the persisted model is the expression.

## Consequences

- The serializable chart spec stores expression strings; validity is whatever DuckDB accepts.
- Master items (reusable dimensions/measures) become named \`{label, expr, fmt}\` records — same shape, referenced by charts.
- **Q6 open**: where the master-item library lives — (A) workspace-level in internal DB (\`d8a_monster_master_items\`, referenced by stable id), (B) page-level inside the page spec, or (C) both with a promotion flow (page-local → workspace), resolving page-local first. Pair A/C with **stable id** references so renames propagate and deletion surfaces a "missing master item" state instead of breaking silently.

## Source

- Design interview turn, 2026-09-15 (user request for Qlik-style measures/dimensions and master items).

# Proxy remote LLM calls through Rust, not webview fetch

## Context

The Analyst page (\`/analyst\`) talked to remote LLM providers (e.g. z.ai) by calling \`fetch\` directly from the SvelteKit webview. Browsers enforce CORS, the provider endpoints send no \`Access-Control-Allow-Origin\`, so every remote request failed with \`net::ERR_FAILED\` — remote chat was completely broken. The local llama.cpp path already worked via Rust commands emitting \`local-llm:*\` events.

## Choice

Proxy ALL remote LLM calls through Rust:

- New \`remote_chat\` Tauri command in \`src-tauri/src/commands/local_llm.rs\` — POSTs via \`reqwest\` (no CORS in native code) in a background thread, parses the SSE stream, and emits the same \`local-llm:token\` / \`local-llm:done\` / \`local-llm:error\` events the local path uses.
- Frontend: deleted the fetch-based \`sendRemote\`; extracted one shared \`streamViaEvents()\` in \`src/lib/stores/analyst.svelte.ts\` used by both local and remote paths (~100 lines net deleted).
- Shares the existing \`generate_cancel\` flag, so the Stop button works for both modes.

## Alternatives considered

- Keep webview fetch and configure a CORS proxy / ask providers for CORS headers — external dependency, fragile, per-provider.
- Separate event channel for remote — rejected; one streaming code path for both local and remote is less code and uniform behavior (Stop, partial-message retention).

## Consequences

- Any future remote LLM provider must be added on the Rust side, never via webview fetch.
- One streaming contract (\`local-llm:*\` events) covers all LLM modes in the frontend.
- Rust changes require a dev-server restart to take effect.

## Decision

# Q15 locked: reference annotations are a declarative list; reference_line only in v1

## Context

Question 15 in the chart/report spec design interview (series that locked Q3, Q5–Q13). Evidence.dev charts get annotations via \`reference_line\` / \`reference_area\` / \`reference_point\` children — the classic "one chart needs a target line" case. We had to decide whether annotations enter the declarative spec in v1, and if so how.

## Choice (B — reference_line only, now)

Chart spec gets an \`annotations\` list, v1 entry \`reference_line\`:

\`\`\`json
"annotations": [{ "type": "line", "on": "y", "at": <measure expr or number>, "label": "Target", "color": null }]
\`\`\`

- The **engine computes the value** — \`at\` can be a master-measure expression (e.g. *avg hours target*) or a literal number.
- Every chart type declares **how it draws a y-line via its registry mark** (~1 line for most cartesian charts; heatmap/pie opt out).
- Serializes trivially → code-mode/UI-mode parity by construction (consistent with [[two-surface-report-page-format]]).

## Alternatives considered

- **A — Defer**: not in v1; a chart needing a target line waits.
- **C — Full set now** (line + area band + point highlight): complete Evidence parity, but three render paths per chart type up front.

## Rationale

The mechanism is the real design: an annotation list + engine-evaluated value + per-type draw hook. \`area\` and \`point\` later are just new entries in the same list — no new architecture. B builds the mechanism without paying C's per-type render cost for features nobody has asked for yet.

## Consequences

- Spec carries a typed \`annotations\` array; the block/chart registry needs a "draw a y-line" hook per chart type.
- Non-cartesian types (heatmap, pie) must explicitly opt out.
- \`area\`/\`point\` annotations slot in later as new \`type\` values.

# Q15 reframed: annotations should speak svelteplot's own mark vocabulary (whitelisted per chart type)

## Context

Reframe of [[q15-locked-reference-annotations-are-a-declarative-list-refe]] (Q15: annotations are a declarative list, engine-evaluated \`at\`, per-type draw hook — that mechanism survives). In the follow-up interview the user pointed at https://svelteplot.dev/features/marks: since [[svelteplot-sole-chart-engine]] (svelteplot renders everything), we don't need to invent Evidence.dev's \`reference_line/area/point\` vocabulary — svelteplot already names ~20 marks (area, arrow, bar, box, brush, cell, dot, frame, grid, line, link, pointer, raster, rect, regression, rule, text, tick, trail, vector, waffle, …). Q15 was re-asked as "how far does the annotation spec go in svelteplot's vocabulary?"

## Options on the table

- **A — Whitelisted annotation marks** (assistant's lean): spec gets \`annotations: [...]\` where each entry is a svelteplot mark + values, e.g. \`{ "mark": "ruleY", "at": 120 | { "expr": "avg(hours) * 1.1" }, "label": "Target", "color": null }\`. \`at\` accepts a literal or a **measure expression** (engine evaluates against the chart's data). Each chart type's registry entry declares **which annotation marks it hosts** (cartesian: rule/dot/text; heatmap: none). No-code surface: an "Add annotation" menu listing the type's supported marks + fields.
- **B — Fixed trio, svelteplot underneath**: only line/area/point in the spec, mapped internally to ruleY/ruleX, rect/area, dot. Smaller vocabulary but re-invents types svelteplot already names; "add a tick/text label" later means new spec types again. (Closest to the original Q15 lock.)
- **C — A + arbitrary layered marks**: any svelteplot mark with data refs, extra channels, own dataset (second series layered in). Max power — but that's a second chart-engine DSL inside the spec; the \`plot_options\` escape hatch (Q1-C) already serves power users.

## Current lean

**A** — svelteplot's own vocabulary, bounded by a per-type whitelist, expressions allowed for values. B re-invents what svelteplot names; C is what the escape hatch is for.

## Status

Proposed — awaiting the user's pick. If **A** is locked, this **supersedes** the v1 vocabulary of the original Q15 lock (its \`type: "line"\` entry becomes \`mark: "ruleY"\`, etc.); if **B**, the original lock stands. The \`annotations\` list + engine-evaluated \`at\` + per-type registry hook mechanism is common to all options.

## Related

- Builds on [[svelteplot-sole-chart-engine]] — one engine, so its mark names are the vocabulary.
- Extends [[measures-dimensions-are-duckdb-expressions-not-column-agg-su]] — \`at\` accepts measure expressions.

Report-pages design interview (Q-series, 2026-09-15). Q3 locked the two-surface format: one declarative spec document edited by both Design and Code mode. Q15's decision left open **Q16 — the no-code editing surface**. The user then specified the flow directly: a user creates pages in \`/pages\`, a new page opens at \`/page/<slug>\`, and the user builds the page there with content/components ("the A-pattern" = the dual-mode editor).

## Decision

**Locked (Q16):** \`/pages\` is the index + creation surface only. Creating a page immediately routes to \`/page/<slug>\`, which hosts the dual-mode (Design ⇄ Code) editor over the single declarative spec. All editing happens at the slug route, never in the list.

- **Modal / in-list editing** — rejected: page authoring with grids, charts, and annotations needs full-canvas space, not a dialog.

# Q7 locked: relationship graph drives chart item availability and auto-JOIN

## Context

Continuation of the 2026-09-15 chart-spec/report-page design interview. Q6 ([[master-item-library-table-binding-q6]]) locked the workspace-level master-item library with explicit table binding and left **Q7 open**: how the binding drives chart item availability.

The user answered **B** to Q7.

## Choice

**B locked — table matching + relationship graph.** The relationship graph drives both sides of the data path:

- A chart bound to table X offers master items from X **and tables related via the table-relationships model** (\`.prds/table-relationships\` PRD).
- Picking an item from a related table makes the chart's query auto-\`JOIN\` along the declared relationship (\`bookings ⋈ clients\`) — Qlik-association feel.

This closes the data path: stable-id master items + explicit table binding + relationship-driven availability/auto-JOIN.

## Alternatives considered

- **A) Strict table matching** — simple and siloed; rejected because it can't deliver the requested "smart logic" across related tables.
- **C) Inference-first** (parse expressions, match against all schemas) — most "smart", least predictable; renames or shared column names shift associations silently.

## Consequences

- Table-relationships (\`.prds/table-relationships\`) becomes a **load-bearing dependency** of chart item availability — not just a documentation PRD.
- Chart SQL generation gains a **JOIN-planning responsibility** for cross-table items.
- This reopened Q5's follow-up as **Q8 (open)**: who generates the SQL — one shared query engine for all 32 chart types (chart type = pure renderer + role schema), per-type query templates, or shared engine + per-type hooks (date grain transform, top-N + Other, funnel ordering). Assistant lean: shared engine + type hooks (C) — one canonical query covers ~28 types, the few needing reshaping (heatmap grid pivot, funnel) get a hook instead of a forked engine.

# Q8 locked: one canonical query engine with per-type hooks

## Context

Continuation of the 2026-09-15 chart-spec/report-page design interview. Q7 ([[q7-locked-relationship-graph-drives-chart-item-availability-]]) left **Q8 open**: who generates the SQL — one shared query engine for all 32 chart types, per-type query templates, or shared engine + per-type hooks.

The user answered **C**.

## Choice

**C locked — one canonical query engine + per-type hooks.** One shared query engine turns filled data roles into SQL for every chart type (chart type = pure renderer + role schema). The few shapes that need reshaping register hooks on the engine instead of forking it: **grain** (date transforms), **top-N + "Other"** bucketing, **grid pivot** (heatmap), **funnel ordering**. One canonical query covers ~28 types; hooks cover the rest.

# Q9 locked: chart option panels are schema-driven with a custom-panel hatch

## Context

Continuation of the 2026-09-15 chart-spec/report-page design interview. Q8 ([[q8-locked-one-canonical-query-engine-with-per-type-hooks]]) left **Q9 open**: how per-type chart options reach the no-code UI — hand-built panels per type (the current [[each-labs-chart-owns-its-config-panel]] rule), schema-driven panels auto-rendered from a registry options schema, or B + a custom-panel escape hatch.

## Choice

**C locked — schema-driven options + custom-panel hatch.** Each chart type's options are declared once in its registry options schema (field name, kind, default, min/max); the option panel is auto-rendered from that schema, and code mode edits the same schema as JSON (unknown field → validation error). When the generated panel can't express a chart's needs, the chart supplies a custom panel — but the schema **still declares the field**, so both surfaces (code + no-code) stay consistent.

## Alternatives considered

- **A) Hand-built panels per type** — 32 bespoke panels, maximum freedom, guaranteed drift between code mode and UI mode.
- **B) Pure schema-driven, no hatch** — consistent and cheap, but the first chart needing bespoke UI forces a fork.

- The options schema becomes part of each chart type's contract alongside its role schema (from Q8) — one declaration drives rendering, the option panel, and code-mode JSON.
- Refines (does not supersede) [[each-labs-chart-owns-its-config-panel]]: ownership stays per-chart; panel construction is schema-generated, custom panel is the exception.
- Keeps [[two-surface-report-page-format]] parity by construction: schema is the single source both surfaces edit.

**Q10 (open, lean B)** — what a click/selection does on a published page: (A) local highlight only, (B) **cross-filter** — selection becomes a \`WHERE\` on the dimension, other charts re-query DuckDB (Qlik-style, the payoff of the Q8 query engine), (C) B + Evidence-style \`sync\` (linked tooltips/crosshair/zoom). Evidence separates \`sync\` (linked visuals) from \`filters\` (propagation) — useful distinction for when Q10 locks.

# Two-surface report pages: code mode edits a declarative spec, not Svelte source

## Context

Interview (2026-09-15), Q3. User requirement: charts must be addable to a report page from **two interchangeable surfaces** — code mode and no-code mode — and either surface can **create/edit the same page** with identical chart appearance, design, and logic. This is the Evidence model itself: one document that both the built-in editor and VS Code edit. It extends the chart-level requirement in [[chart-authoring-two-surfaces-serializable-spec]] to the whole report page.

This forces the central decision of the entire two-surface design: **what the "code" in code mode actually is**, because that defines the parity contract.

## The options presented (Q3)

1. **A — Constrained declarative spec**: the page is a document (JSON / JSON5 / small DSL) holding a list of chart blocks (\`{ type, data: { table, x, y, series }, title, options }\`). Code mode edits the text; no-code mode edits the same document via UI. **Perfect parity by construction** — nothing expressible in code lacks a UI representation (worst case the UI falls back to a raw JSON field, Evidence's \`echarts_options\` approach).
2. **B — Real Svelte markup**: code mode writes actual \`<Chart>\` components with snippets/functions/full JS. Maximum power, but no-code cannot round-trip arbitrary code — the page becomes partially UI-editable; unrepresentable parts render read-only or get clobbered.
3. **C — A + registry escape hatch**: declarative spec as the page format, plus custom blocks referencing registered components by name (\`{ type: "custom:myRadar" }\`). Custom *visuals* stay code-authored in app source; any *instance* stays UI-configurable via its declared props schema. Evidence has no equivalent — this is the "32-chart catalog as the registry" play (see [[labs-catalog-placeholder-first]]).

## Recommendation (assistant lean — user answer pending)

**A for the page/document format, C as the growth path** — C is A plus registration discipline, which the catalog already implies.

## Rationale

- Parity is a hard user requirement; only A guarantees it by construction rather than by ongoing enforcement.
- B permanently breaks the parity contract the user just stated.
- C preserves A's guarantees for built-in types while giving power users a code escape hatch that instances of still round-trip.

## Consequences

- Page persistence format must be a serializable document, not Svelte source (aligns with [[evidence-chart-architecture]] and [[chart-fundament]]).
- If C is adopted later, chart components need declared props schemas so the no-code surface can configure custom-block instances.

## Data binding (Q4 — answered 2026-09-15)

**User chose B, refined: each chart carries its own template query whose dimension/measure slots are filled dynamically** by what the chart declares — the query always aggregates exactly what the chart needs (a mini semantic layer per chart):

\`\`\`sql
SELECT {{dimensions}}, {{measures}}
FROM bookings
GROUP BY {{dimensions}}
ORDER BY {{measures_desc}}
\`\`\`

with the chart declaring \`dimensions: ["month"]\`, \`measures: [{ col: "hours", agg: "sum" }]\` → \`sum(hours) AS hours\`.

**Open follow-up (Q5)** — template *ownership*, which decides how much SQL users ever see:

- **A** per chart instance — each chart block stores its own template text + bindings (max SQL freedom)
- **B** per chart type — the 32-type registry ships each type's standard aggregation template; an instance declares only \`table\`, \`dimensions\`, \`measures\`, \`filters\` (no per-chart SQL exists)
- **C** layered — registry default per type + optional per-instance override (A's escape hatch, still a serializable string + slots)

Sub-point pending confirmation: aggregation is declared **on the measure** (\`{ col, agg }\`), never written as free text.

## Status

**Accepted — user locked A (2026-09-15).** The page is a declarative spec document; both surfaces edit it; parity is guaranteed by construction. C (registered custom-block escape hatch) was not chosen now but remains the natural growth path if power users need it.

Q4 locked (2026-09-15): chart blocks bind data via per-chart template queries with dynamic dimension/measure slots — see "Data binding (Q4)" above. Q5 (template ownership: instance / registry / layered) is the open question.`,

# Typography: Inter for all UI, Geist Mono reserved for data detail

## Context
The 2026-09-12 [[professional-finance-redesign-ledger]] chose Spectral (display) + Public Sans (body) + Geist Mono/Lekton for data. User then asked to change **all fonts to Inter**, with low-level data detail (table cells, chart labels) allowed to stay mono. Ledger-green theme/tokens unchanged.

## Choice
- **Inter** for everything UI: \`--font-display\` and \`--font-body\` both → \`'Inter', sans-serif\` in \`src/app.css\` (token names unchanged, so all consumers restyle automatically — same trick as the ledger redesign).
- **One mono**: Geist Mono only. Lekton dropped; chart labels in \`src/lib/charts/Picasso*Canvas.svelte\` switched Lekton → Geist Mono. \`src/app.html\` font link loads only Inter + Geist Mono.
- **Data detail stays mono**: \`Heatmap.svelte\` (svelteplot) tick/in-cell labels forced to \`--font-mono\`; \`.data-table th/td\` already mono — unchanged.
- Typography showcase (\`/ui\` + both \`Typography.svelte\` copies) updated; fixed stale "Manrope" body-font card.

## Alternatives
Keep the Spectral/Public Sans pairing — rejected by user request. Keep Lekton as a second mono — dropped in favor of one mono everywhere.

## Consequences
Type hierarchy now relies on Inter weight/size, not serif/grotesk contrast. The mono-for-data convention (see the rule below) governs new components: any new data-dense surface (table cell, axis tick, in-cell label, code) uses \`--font-mono\`; everything else Inter.

# Glossary

| Term | Definition |
|------|------------|
| Tauri | Desktop app framework (v2) wrapping the SvelteKit webview in a native Rust process; the Rust side owns DuckDB and exposes commands via \`invoke\`. |
| DuckDB | Embedded analytical SQL database (1.1, bundled in the Rust build) storing all ingested data and metadata in a single file. |
| Workspace | User-selected folder where Data Monster creates \`d8a_monster.duckdb\`, its WAL, and \`data/main/\` copies of ingested files; survives restarts. |
| \`d8a_monster.duckdb\` | The main DuckDB database file holding all user tables and internal metadata tables. |
| \`d8a_monster_*\` tables | Internal metadata tables (labels, groups, saved queries, settings, field functions) editable via Settings → Internal DB. |
| Tauri command | Rust function in \`src-tauri/src/commands/\` registered in \`main.rs\` and callable from the frontend through \`invoke('command_name', …)\`. |
| db-operations | \`src/lib/db-operations.ts\` — typed frontend wrappers for every Tauri command plus shared result/error types. |
| Ingest | Turning a source (file/URL/Postgres table/CTAS query) into a persistent DuckDB table, optionally with a group and tags. |
| Connect | Route \`/connect\` for uploading files, downloading from URLs, and connecting to PostgreSQL. |
| Preview | Route \`/preview\` showing column detection, type overrides, and row samples before generating ingest SQL. |
| CTAS | \`CREATE TABLE AS SELECT\` — supported way to materialize query results as a new table, with the ingest modal. |
| Labels | Tags and groups attached to tables for organizing/filtering in the Data explorer (persisted in \`d8a_monster_*\`). |
| Saved queries | SQL queries stored with a name in internal metadata, reloadable from the Query page. |
| Analyst | \`/analyst\` chat interface that asks a configured LLM questions about the workspace data. |
| Local LLM | llama.cpp integration (\`llama-cpp-2\` in Rust) letting the analyst run against a local model instead of a remote API. |
| Pages | \`/pages\` — lightweight data pages (KPIs, charts) built from query results. |
| Chart library | Reusable, configurable chart components (\`src/lib/charts/\`) — bar/line/area/pie/donut/scatter canvases with click-to-filter. |
| LayerChart | Svelte-native charting library (primary engine for the chart library). |
| Picasso.js / SveltePlot / Unovis / ECharts / Observable Plot | Alternative chart engines evaluated and prototyped in Labs and \`.archive/\`. |
| Labs | \`/labs\` experimental workspace where chart engines and components are tested before promotion. |
| Field functions | Saved column transformations (function library) speced in \`.specs/field-function-library\`, managed under Settings. |
| Internal DB browser | Settings → Internal DB UI for inspecting/editing/deleting \`d8a_monster_*\` metadata rows. |
| WAL | Write-ahead log (\`d8a_monster.duckdb.wal\`) auto-managed by DuckDB. |
| Runes | Svelte 5 reactivity primitives (\`$state\`, \`$derived\`, \`$effect\`, \`$props\`) used in all stores and components. |
| \`.specs\` | Spec-driven feature folders: \`spec.md\` plus \`tasks.json\`/\`tasks-log.json\` task tracking per feature. |
| \`.prds\` | Product requirement documents with interview transcripts for upcoming initiatives. |
| \`.archive\` | Quarantined superseded code: the old DuckDB-WASM web app, worker-scaffolding experiments, and old chart trials. |
| OKF | Open Knowledge Format — the frontmatter convention used by \`docs/wiki/\`. |
| OpenCode / pi | AI coding-agent tools configured here (\`opencode.json\`, \`.opencode/\`, \`.pi/\`) used during development. |
| Global Superstore | Sample retail dataset (\`global_superstore.csv\`) used for demos and testing. |

# CDP repro traps: DuckDB workspace lock pins a second instance at /; headless needs a mocked Tauri surface

Follow-up to [[drive-data-monster-s-real-ui-over-cdp]] and [[webview2-cdp-gotchas-env-var-flag-stale]] — two more repro-environment traps hit while chasing the 2026-09-14 Labs bar-chart hang:

1. **DuckDB workspace lock → second instance stuck at \`/\`.** \`d8a_monster.duckdb\` is single-writer; if an app instance is already running against the same workspace (e.g. the user's hung one), a freshly launched CDP instance fails \`app.init\` on the file lock and never leaves the workspace picker (\`/\`). A probe instance that "won't navigate away from \`/\`" almost always means **another instance holds the DB**, not that routing is broken. Kill existing instances (or point the probe at a different workspace) before reproducing.
2. **Plain-headless probes are contaminated.** Loading the app in a non-Tauri browser throws in the layout's Tauri \`listen\` wiring — that failure is noise, not the user's bug. To reproduce headless, mock the Tauri surface (what \`app.init\` invokes) first; otherwise every result is a false negative.

## Why it matters

Both traps burn hours by producing misleading symptoms (blocked navigation, phantom exceptions) that look like app bugs but are repro-harness artifacts. Check for a second instance and mock Tauri before trusting any probe result.

# Chart authoring needs two surfaces (code + UI) — design must converge on a serializable chart spec

## Requirement (user-stated, 2026-09-15 interview)

Charts must be addable via **two surfaces** later on:

1. **Code only** — writing markup / a spec object (the code surface).
2. **Interacting with UI elements/behaviors** — an interactive builder surface.

## Why it matters

Whatever the code surface can express, the UI surface must be able to **produce and persist** (and vice versa: code authors need a stable target to hand-write). That pushes the chart contract toward a **serializable chart spec object** that both surfaces consume — not just Svelte props bound at authoring time.

This is a hard constraint on the central reusable-chart design being interviewed right now (see [[evidence-chart-architecture]] and [[chart-fundament]]): any design that can't round-trip a chart instance to/from a persisted spec will fail the second surface.

## Still open (interview in progress)

- Q2 pending: do the surfaces author chart **instances** (configure existing types), **new chart types** (add to the 32-card catalog), or instances-now/types-code-only?
- If instances: where do UI-authored charts persist — \`/pages\`, a new "charts" store, or exported code?

# "Couldn't find callback id" Tauri warning is a benign reload artifact

\`[TAURI] Couldn't find callback id <n>. This might happen when the app is reloaded while Rust is running an asynchronous operation.\` is benign. It appears when the webview reloads (dev HMR or manual) while an async Rust operation still holds a callback — e.g. after a failed/blocked call that gets interrupted. Seen during the Analyst CORS incident: the warning was a side effect of the failed request + reload, not a bug itself, and disappeared once the root cause was fixed. Don't chase the callback id; look for the underlying failed async operation.

# Drive data.monster's real UI over CDP with --remote-debugging-port for e2e debugging

The changelog-e2e skill's technique transfers from the changelog.monster app to **data.monster**: launch the Tauri app with \`--remote-debugging-port\` and drive the real webview UI over CDP (Chrome DevTools Protocol). This works because both are Tauri v2 apps whose frontend is a webview.

## When to use

- Debugging "page isn't working" reports (e.g. the Analyst \`/analyst\` page) where you need to click the real UI, watch console/network, and reproduce the user's flow — not just read code.
- Any e2e verification of a registered flow: connect → preview → query → data.

## How

1. Run the app with the remote debugging flag (the changelog-e2e skill at \`C:\\Users\\PTW\\.pi\\agent\\skills\\changelog-e2e\\SKILL.md\` documents the exact incantation for a Tauri v2 app).
2. Attach over CDP and drive the actual rendered UI.

## Why it matters

Static code reading missed the bug class the user is reporting; driving the real UI reproduces it directly. This gives data.monster the same e2e debugging capability that changelog.monster already has, with zero new tooling.

# Evidence.dev chart architecture: one typed component per chart type over shared machinery, consistency via a standardized prop taxonomy

Distilled 2026-09-15 while planning the central reusable-chart design (interview in progress; user asked to study docs.evidence.dev/components/scatter_chart and /core-concepts/components first).

## Key architectural insight

Evidence does **not** have one god chart component. It has one typed component **per chart type** (\`scatter_chart\`, \`bar_chart\`, …), each built over shared machinery (query builder + ECharts + shared prop vocabulary). Consistency lives in a **standardized attribute taxonomy**, not in a single \`<Chart type=…>\` component. This is the reference model for our central chart design: shared shell + shared prop types + one thin component per chart type (proposed default (b) in the interview; god components rot with 32 chart types).

## Evidence's prop taxonomy (distilled)

- **Data binding**: \`data\` (table), \`x\`/\`y\`/\`y2\` columns, \`series\`, \`size\` (scatter), \`sort\`, \`limit\`, filters — aggregation is part of the binding (\`x="avg(avg_transaction_value)"\`, in-query)
- **Title block**: \`title\`, \`subtitle\`, \`info\`/\`info_link\` — every component has it
- **Value formatting**: \`x_fmt\`, \`y_fmt\`, per-label \`fmt\` — one shared format vocabulary
- **Axis options**: typed option groups (\`title, ticks, baseline, labels, gridlines, min, max, fit_to_data, interval, label_rotate\`) — same shape for x/y/y2
- **Legend**: \`legend\`, \`legend_position\`, \`series_order\`
- **Styling**: \`chart_options\` (palette, series colors, zoom), \`opacity\`, and \`echarts_options\` — a raw escape hatch deep-merged over the config
- **Data labels**: position/fmt/size/rotate/show_overlap
- **Missing values**: \`connect | gaps | zero\` (time-series semantics)
- **Overlays**: \`reference_line\` / \`reference_area\` / \`reference_point\` as composable children
- **Cross-chart linking**: shared \`link\` id syncs tooltips/zoom across charts

## Where we already stand

[[chart-fundament]] (buildBars + sameDatum), generic accessor props \`<T>\`, bindable positional selection, tooltip snippet, empty guard, \`heightVh\`, and the per-chart config drawer rule ([[each-labs-chart-owns-its-config-panel]], [[labs-charts-reusable-fundament]]) already cover roughly 60% of this taxonomy — it just isn't written down as one central design yet. The pending interview decides: shared \`ChartShell\` + shared \`AxisOptions\`/\`fmt\`/\`seriesColors\` vocabulary vs per-chart props; centralized \`aggregate()\` fundament API (opt-in for scatter/line); single-select as standard.

Related: [[barchart-component]], [[heatmap-component]].

# get_settings merges env/.env over settings.json — env is source of truth

Discovered while wiring \`.env\` into the app (2026-09-11).

## Behavior

\`get_settings\` in \`src-tauri/src/commands/settings.rs\` reads \`LLM_API_KEY\`, \`LLM_API_URL\`, \`LLM_MODEL\` from the real environment first, then from a \`.env\` file, and **merges them over \`settings.json\`** — env wins. If the Settings UI "ignores" your saved values, check whether \`.env\` at the repo root defines them; env is the source of truth.

## Gotchas

- **Tauri's cwd is \`src-tauri\`**, not the repo root — the \`.env\` lookup searches upward from cwd to find the project-root \`.env\`.
- \`LLM_API_URL\` is accepted with or without the \`/chat/completions\` suffix (base URL is normalized automatically).
- No dotenvy crate and no reload logic — \`get_settings\` re-reads env/\`.env\` on every call, so a restart is the only "reload" needed.

## Related

- Settings UI and Analyst both consume \`get_settings\`, so no frontend change was required for env config.
- See [[decisions/proxy-remote-llm-calls-through-rust-not-webview-fetch]] for the related rule that all LLM calls go through Rust.

# Labs bar-chart "hang" is an infinite vite reconnect/reload loop, not a component bug

Reported 2026-09-14: clicking the **bar chart** card in \`/labs\` "hangs the page" while the heatmap card works; user noted everything worked before the bar chart was built.

## What the symptom actually is

Not a component exception — an **infinite vite client reconnect loop**: the page performs endless full reloads, so it renders nothing and appears frozen. User-visible fingerprint: a **\`[vite] connecting\` message flickering in the console the whole time** (websocket dropping/reconnecting). Diagnostic fingerprints:

- Zero exceptions on page, zero render, body never populates.
- Console floods with vite client reconnect messages (server connection lost / polling).
- \`src/app.css\` **never changes on disk** — the Tailwind dev plugin regenerates its virtual output in a loop, which is what trips vite's reload, not a real file edit.

## Root cause (found 2026-09-14, same day)

Two stacked mechanisms:

1. **Likely original trigger — dep-optimizer + vitest import reachable from \`src/\`**: the bar-chart page was the *only* \`/labs\` page importing from \`$lib/charts/\`, where \`fundament.test.ts\` (importing \`vitest\`) sat. Vite's dev dep-optimizer choked on it → hang on that page only.
2. **Amplifier — file churn → tailwind re-emit → full-reload feedback loop**: the Tailwind dev watcher scans the repo tree by default, so *any* file write in the project root (vite's own log file, wiki writes, session files) makes tailwind re-emit \`app.css\` → SvelteKit full reload → more churn → forever. Proven by writing a vite nohup log into the repo root and watching the loop start.

Dead-end theories ruled out en route: nondeterministic tailwind output (served CSS diffed byte-identical), Tauri CSP blocking \`ws://\` (CSP is null), broken vite.config (plain).

## Fix (PR #3, commit \`9f18749\`, merged \`69d151a\`)

User-directed approach: **make the bar-chart page a structural mirror of the working heatmap page** — everything inline in the page, only the chart component imported, no \`$lib/charts\` import from the page. Plus:

- \`fundament.test.ts\` moved to \`tests/\` — the \`vitest\` import no longer sits inside \`src/\` where the dev server's dep-optimizer can trip over it. See [[tests-outside-src]].
- \`app.css\` pins Tailwind \`@source\` to \`src/**\` + \`app.html\` — wiki/log/session churn can no longer re-emit CSS into a reload loop. See [[pin-tailwind-source-scanning]].

Verified: 9/9 tests from \`tests/\`, \`svelte-check\` 0 errors, build clean.

## Debug gotchas (cost real time)

- **Environment contamination**: installing vitest for probes *silently bumped vite 8.0.7 → 8.0.9*, and running vite with \`--host 0.0.0.0\` diverges from the user's exact setup. When debugging user-env issues, verify \`node_modules\` versions match the user's before trusting any probe result.
- Mock/headless harness is a dead end for this class of bug — the user's real environment is ground truth (see [[cdp-repro-traps-duckdb-lock]] for the related traps).
- A vite instance left over from the chart-lib dep removals ([[svelteplot-sole-chart-engine]]) has stale \`optimizeDeps\` — clean restart required before page comparisons are meaningful.

**Triage rule: "Labs card hangs, no console errors, \`[vite] connecting\` flicker" → check for a vite reconnect loop before blaming the chart component.**

# LLM API data retention: "no training" ≠ "no storage"; local models are ZDR by construction

Research verified against primary docs (2026-09-11) on how the 6–8 major LLM API endpoints handle data retention and sensitive data. Directly relevant to Data Monster's Analyst feature, which calls remote LLM APIs and also supports local llama.cpp.

## Key non-obvious facts

- **"No training" ≠ "no storage."** Every major provider except current-policy Anthropic keeps ~30 days of inputs/outputs for abuse monitoring even when they never train on them. Zero Data Retention (ZDR) is what removes that, not "we don't train on it."
- **ZDR is a contract, mostly sales-gated.** OpenAI / Anthropic / Google / Azure require talking to sales; exceptions: xAI (self-serve Console toggle, team-wide, verifiable via \`x-zero-data-retention: true\` response header) and Mistral (paid-plan request).
- **Stateful features break ZDR everywhere.** Files APIs, Batch, server-side conversation state, RAG collections, explicit caching are all exempt from ZDR because they must persist to function.
- **Trust-and-safety flags override everything.** Anthropic can retain flagged content up to 2 years regardless of ZDR. No provider's "zero" survives a legal hold.
- **Provider specifics worth remembering:**
    - Anthropic: prompts/outputs not retained at rest by default; self-serve HIPAA/BAA option.
    - Google Gemini: **free tier trains on data**, paid does not; ZDR is per-project on paid.
    - Azure OpenAI: data stays in your Azure region/tenant; ZDR via Microsoft form; the regulated-industry favorite.
    - Cohere: can deploy fully in your own VPC — strongest "data never leaves" hosted option.

## Data Monster relevance

- The Analyst feature's **local llama.cpp support is ZDR by construction** — the right escape hatch for sensitive workspaces. A DPA only promises behavior; an air gap guarantees it.

# LLM provider retention, part 2: Kimi, Z.ai, Together, Qwen — Kimi policy contradiction, Z.ai DPA strength, tier framework

Follow-up research (2026-09-11) on Kimi (Moonshot), Z.ai (Zhipu/GLM), Together AI, and Qwen (Alibaba Model Studio), verified against primary docs. Extends [[llm-api-data-retention-no-training-no-storage-local-models-a]].

## Key findings

- **Kimi (Moonshot)** — trust gap of the group: Help Center FAQ says "never trains / no persistent storage," but the binding Privacy Policy says user content helps "optimize our models" (training use, legitimate interest) with indefinite retention ("as long as necessary"). When they conflict, the policy wins — treat Kimi API as training-permitted, retention-unspecified. International API runs via Singapore entity (Moonshot AI Pte. Ltd., Chinese parent) with mandatory content-safety review.
- **Z.ai (Zhipu/GLM)** — API DPA §4(b) claims content is "processed in real-time… not saved on our servers" (effectively zero content storage by default), plus delete-on-termination and law-enforcement-request notification — a proper GDPR-style processor agreement, ZDR by default. Consumer z.ai chat *does* train. Caveat: third-party reviews note the no-storage claim lacks documented corroboration. GLM open weights are MIT.
- **Together AI** — three independent toggles: storage (default **ON** — turn off for ZDR, self-serve), training (default off), passthrough (default on; ZDR forces it off). Passthrough models forward prompts to the upstream vendor's policy. Third-party models (DeepSeek, Qwen) hosted by Together never call home — DeepSeek-via-Together runs in North American data centers, the pragmatic way to use DeepSeek without China-jurisdiction exposure.
- **Qwen (Alibaba)** — three very different doors: qwen.ai chat (consumer terms, trains), Model Studio/DashScope ("will never use your data for model training", China-mainland or Singapore region), and open weights (Apache-2.0, self-host). Qwen 3 Max is also served via Cloudflare Workers AI with ZDR.

## Tier framework (big-12 view)

- **Tier 1** (documented, contractual no-training + workable ZDR): OpenAI, Anthropic, Azure, Google, xAI, Cohere, Mistral
- **Tier 2** (good defaults, self-serve controls, but storage-on-by-default or thin corroboration): Together (toggle ZDR on), Z.ai (strong DPA, uncorroborated)
- **Tier 3** (assume public-grade handling): DeepSeek first-party, Kimi (policy contradiction), Qwen-via-China-region

Rule of thumb: **marketing FAQ ≠ terms of service** — always verify against the binding privacy policy/DPA. For Data Monster workspaces with sensitive data, local llama.cpp still beats every contract on this list.

# Local LLM blank-screen delay was hidden thinking tokens — disable via "thinking": {"type": "disabled"}

## Symptom

Analyst chat with a local (llama.cpp) model sat on a blank screen for ~20s before any text appeared. Queries/ingest were fine — the delay was all in the LLM stream.

## Root cause

The local server streams \`reasoning_content\` (thinking) deltas **before** \`content\` deltas. The app's stream parser in \`src-tauri/src/commands/local_llm.rs\` only emits \`delta.content\` and silently discards \`reasoning_content\` — so the model's hidden reasoning (~737 tokens, ~18s) played out invisibly while the user waited.

## Fix

Add \`"thinking": {"type": "disabled"}\` to the request body in \`local_llm.rs\`. Measured on a realistic analyst prompt:

| mode | total time | reasoning chunks |
|---|---|---|
| thinking on (before) | 23.9s | 737 |
| thinking disabled | 5.5s | 0 |

## Gotchas

- One early test still returned reasoning despite the flag; repeat/stability checks showed 0 reasoning chunks — verify with more than one request before concluding the flag is ignored.
- If thinking is ever wanted back (e.g. better answers on hard prompts), the parser needs to handle \`reasoning_content\` and the UI needs a collapsible "thinking" section — that was deliberately skipped.

# Stale-wiki file floods — only noise if an ignore pattern actually matches the tree

## Symptom

The end-of-turn wiki staleness report can list thousands of "changed" files — e.g. "3485 file(s) changed" — and any scan over them stalls (see also [[never-tree-scan-archive-or-src-tauri-target-du-find-stall-on]]).

## Cause

The flood is build/dependency artifacts — but such files are only noise if an ignore rule actually MATCHES them. On 2026-09-12 the flood was \`src-tauri/target/\` (Rust build tree): no \`.wiki_ignore\` pattern covered it and the wiki-context extension had no built-in defaults, so every artifact looked like a real change.

## Fix (2026-09-12)

- Appended \`src-tauri/target/\` to this project's \`.wiki_ignore\` — immediate effect.
- The wiki-context extension (\`index.ts\`) now merges \`BUILTIN_IGNORES\` (~40 always-on patterns: Rust \`target/\`, Python \`.venv/\`/caches, JVM \`.gradle/\`, .NET \`bin/\`/\`obj/\`, \`Pods/\`/\`DerivedData/\`, \`.dart_tool/\`, JS meta-frameworks, Terraform, lock files) inside \`loadIgnore()\` — the single choke point both the staleness scan and file-tree generation route through, with or without a \`.wiki_ignore\` present. Loads at next session start.

## Rule of thumb

- A huge stale-file count is noise ONLY for trees an ignore rule actually matches. Check which files are listed: under an ignored tree → do nothing; a whole build tree leaking through (like \`src-tauri/target/\` did) → add it to \`.wiki_ignore\` (or rely on extension built-ins from next session).
- Only source files under \`src/\`, \`src-tauri/\` (except \`target/\`), \`docs/\` (non-generated), \`.specs/\`, \`.prds/\` in the stale list signal real drift worth a concept update or \`wiki_mark_synced()\`.
- Verified matcher edge case: pattern \`src/bin/\` ignores the directory but keeps file \`src/bin.ts\` — dir patterns don't swallow same-named files.

## Related

- Documents the config behind the gotcha in [[wiki-ignore-staleness-policy]] — the entity page for \`.wiki_ignore\` itself.

# Stash pop can silently fail when wiki-recap writes conflict — verify and restore from the stash

Discovered 2026-09-14 while committing session work (PR #3).

## Symptom
\`git stash pop\` appeared to succeed, but \`git status\` showed only 1 tracked file modified — the entire stashed session (Inter/Geist Mono fonts, URL-copy icon, component polish) was missing from the working tree.

## Root cause
The pop conflicted: the background **wiki-recap agent** had written newer recap content into \`docs/wiki/\` files that also existed in the stash. On conflict the pop aborts and **the stash is silently kept** — untracked/other paths from the stash are not restored either, so the product work (\`src/\`) stays hidden inside \`stash@{0}\`.

## Recovery recipe
1. Verify: \`git status\` (file count far below expected) + \`git stash list\` (stash still there).
2. Restore product code from the stash without clobbering newer working-tree files:
   \`git checkout stash@{0} -- src/\` — restores only \`src/\`, keeping the newer wiki-recap files in the working tree.
3. Commit, then before \`git stash drop\` confirm the stash is fully superseded: diff the stash against the branch; only stale wiki snapshots should remain.

## Prevention
After ANY stash pop in this repo, sanity-check that the expected number of modified files is actually present before editing further — concurrent wiki-recap writes make silent conflicts the norm, not the exception.

# SveltePlot BarX vs BarY: BarX is the horizontal bar mark

Discovered while flipping \`charts/BarChart.svelte\` to horizontal (2026-09-14), confirmed against https://svelteplot.dev/examples ("Simple Bars"):

- **\`BarX\` renders horizontal bars** — the measure runs along x, the dimension/band axis is y. \`BarY\` is the vertical counterpart. The suffix names the measure axis, not the category axis, so "X" ≠ "category on x".
- When flipping orientation, the axis-scoped bits move with it: number-axis \`tickFormat\` and grid move to \`AxisX\`, the tooltip anchor swaps sides, and ascending row order puts the largest bar on top for horizontal bars.
- Component had no consumers at flip time, so a direct \`BarY\`→\`BarX\` edit was safe — no orientation prop needed (YAGNI until a second consumer disagrees).

# SveltePlot internals: match datums by position, not identity; guard empty data

Two engine-level gotchas discovered while porting [[heatmap-component]] (2026-09-14), from the explanation of the SveltePlot 0.14.2 implementation. They apply to **every chart-type component ported into Labs** (see [labs-per-chart-type](../decisions/labs-per-chart-type.md)).

## 1. svelteplot re-copies datum records each transform pass

Object identity does not survive a plot pass. Two consequences:

- **Selection can't use \`===\` on the datum** — svelteplot hands you a fresh copy of each record, so a \`selected\` object never matches what the mark callback receives. The proven pattern (from the kees reference): compute the selection *stroke* via a **per-datum function (\`strokeOf\`) that matches on grid position** (e.g. x/y value pair), never on object identity.
- **Direct DOM pokes get wiped** — don't select a cell's DOM node and style it; the next transform pass re-renders it. Encode per-datum state through mark props/functions instead.

## 2. Empty data poisons svelteplot scales with NaN

If zero-row data reaches \`Plot\`, scale transforms produce NaN and the plot breaks. Guard before rendering: check for empty data in the wrapper component and render a "No data" placeholder instead of a \`Plot\` with no marks.

## Related

- [[kees-reference-ports-cleanly]] — the reference implementations already encode both workarounds; port them verbatim.
- [[heatmap-component]] — first component using both patterns (\`src/lib/components/Heatmap.svelte\`).

# SveltePlot ordinal domains sort alphabetically by default — set explicit domain or reverse

Discovered 2026-09-14 while making the /labs bar chart sort desc: page-side data sorting had **no visible effect** because svelteplot's ordinal scales **sort the domain alphabetically by default** (svelteplot source, \`Plot.scale\` domain building, ~line 187). Data order is irrelevant unless you take control of the domain.

## What to do

- **Order the categories explicitly**: \`y={{ domain: [...yourOrder] }}\` — data order is otherwise discarded.
- Or flip the range: \`reverse: true\` (supported; flips the range so domain[0] renders topmost on the y-axis).
- Bar gaps: default band **padding is 0.15**; bump to ~0.3 for clearly separated bars.

## Gotcha

If sorting "doesn't work" on an svelteplot bar/axis, suspect silent alphabetical domain sorting first — check that an explicit \`domain\` or \`reverse\` is set.

Applies to [[barchart-component]] (\`src/lib/components/charts/BarChart.svelte\`) and any [[labs-per-chart-type]] chart using ordinal scales. Related: [[svelteplot-barx-bar-y-orientation]], [[svelteplot-datum-identity-empty-guard]].

# SveltePlot scale bypass needs scale: null — scale: false still routes values through the scale

## Symptom

In \`/labs/bar-chart\`, per-bar selection colors rendered wrong: selecting the top bar made it blue, any other bar orange — instead of the intended literal colors (\`#888888\` deselected, DS green selected).

## Root cause

The BarChart's \`BarX\` fill channel was declared as \`fill={{ scale: false, value: fillOf }}\`. SveltePlot 0.14.2's \`getUsedScales\` checks \`scale !== null\` — so \`false\` does **not** bypass the scale. The literal color strings returned by \`fillOf\` leaked into the default categorical color scale and got remapped to palette colors (hence blue/orange).

## Fix

Only \`scale: null\` bypasses svelteplot's scales:

\`\`\`svelte
fill={{ scale: null, value: (d: any) => fillOf(d as T) }}
\`\`\`

The [[heatmap-component]] already used \`scale: null\` for its stroke and in-cell Text fill channels — that's why it never showed the bug.

## Applies to

Any literal per-datum color in a svelteplot mark channel (\`fill\`, \`stroke\`, …) that must NOT be scaled: declare \`scale: null\`, never \`scale: false\`.

- Fixed 2026-09-14 in \`src/lib/components/charts/BarChart.svelte\` (also switched deselected color to \`#888888\`, selected to DS green \`oklch(0.44 0.1 158)\`).
- Related engine gotchas: [[svelteplot-datum-identity-empty-guard]], [[svelteplot-ordinal-domain-sorts-alphabetically]]

# WebView2 CDP gotchas: env-var flag, stale browser process, dual-stack vite

Follow-up to [[drive-data-monster-s-real-ui-over-cdp]] — four gotchas hit while verifying the 2026-09-12 redesign:

1. **Env var, not process arg**: on Windows/WebView2 the remote-debugging flag must be passed as \`WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="--remote-debugging-port=<port>"\` (env var form), not as a CLI arg to the exe.
2. **Port not binding?** A leftover WebView2 browser process from a flag-less first launch holds the user-data-dir. Find and kill that specific instance, then relaunch with the env var.
3. **IPv4/IPv6 mismatch**: the webview may resolve \`localhost\` to a different stack than vite binds. Start vite with \`--host\` (dual-stack) so the app can reach the dev URL. (Also detach it properly — plain backgrounding flaked; \`nohup\`-style detach worked.)
4. **Node ≥21 has native WebSocket** — quick CDP probes (HTTP /json list + \`Runtime.evaluate\`) need zero deps.

Bonus technique: when no vision tool is available, verify UI restyling objectively via **computed styles** over CDP (\`getComputedStyle\` on headings/buttons/body) instead of screenshots — confirmed Spectral/Public Sans, ledger-green brand mark, and tabular-nums this way.

# z.ai 401 "code 1000 Authentication Failed" means the key itself is bad — verify with curl, not app code

## Symptom

Analyst/Settings LLM calls to **z.ai** fail with:

\`\`\`
API error 401 Unauthorized: {"error":{"code":"1000","message":"Authentication Failed"}}
\`\`\`

## Diagnosis (2026-09-11 session)

- The stored-key round-trip in the app was verified correct (save → load → send).
- Testing the same key directly with \`curl\` against z.ai — on **both** the coding endpoint and the normal API endpoint — returned the identical 401.
- Conclusion: **the key itself is invalid/expired**, not an app bug. It had never been detectable before because CORS used to block every webview request, so no request ever reached z.ai's auth layer. Once remote LLM calls were proxied through Rust (see [[proxy-remote-llm-calls-through-rust-not-webview-fetch]]), the real provider response finally surfaced.

## Rule of thumb

When a remote LLM provider returns 401 from the app, **test the stored key with \`curl\` outside the app before touching app code**. If curl gets the same 401, the fix is on the provider side (create a new key at z.ai → API Keys, paste into Settings → API Key), not in Data Monster.

## z.ai specifics

- Same \`code 1000 Authentication Failed\` on coding and non-coding endpoints — the endpoint choice does not change auth behavior.
- Key management: https://z.ai → console → API Keys.

type: System Overview
title: Overview
description: What this project contains and its structure.
timestamp: "2026-09-11T21:35:13.611Z"

# Overview

**Data Monster** is a desktop data-analysis application — "connect data, query, explore." It is built with **Tauri v2** (native desktop shell), a **SvelteKit + Svelte 5 + TypeScript + Tailwind CSS 4** frontend, and an embedded **DuckDB 1.1** engine living in a **Rust** backend. No server is required: the Rust process owns the DuckDB connection, and the webview frontend talks to it through Tauri \`invoke\` commands.

The core workflow flows through routes: **Connect** (\`/connect\`) ingests CSV/Parquet/JSON from disk or URL and browses/ingests remote PostgreSQL tables; **Preview** (\`/preview\`) detects columns and types; **Query** (\`/query\`) runs SQL (SELECT/CTAS/SHOW/DESCRIBE) with an editor, pagination, and an ingest modal; **Data** (\`/data\`) and **Table detail** (\`/table/[name]\`) manage and browse tables with tags/groups; **Analyst** (\`/analyst\`) chats with an LLM about the data (including local llama.cpp models); **Pages** (\`/pages\`) builds lightweight data pages from query results; **Labs** (\`/labs\`) is a 32-type chart catalog — one card per chart type, scaffolded placeholder-first after theunspokenpitch.com and built one at a time on SveltePlot over a shared chart fundament (heatmap and horizontal bar chart done, 30 still placeholders); and **Settings** (\`/settings\`) configures the LLM and exposes an internal-DB browser for the \`d8a_monster_*\` metadata tables. Everything persists in a user-selected workspace folder as \`d8a_monster.duckdb\` plus copied source files under \`data/main/\`.

Organization is split between product code and process artifacts. Product code lives in \`src/\` (frontend: routes, components, reusable chart canvases, Svelte 5 rune stores) and \`src-tauri/\` (Rust backend: per-domain command modules — files, queries, tables, labels, saved_queries, internal_db, postgres, local_llm, workspace, settings — plus state and utils). Process artifacts document how features are built: \`.specs/\` holds spec-driven feature specs with task logs (chart-lib, field-function-library, local-llm, tauri-migration), \`.prds/\` holds product requirement docs with interviews (reporting-dashboard-pages, table-relationships), \`docs/\` holds research notes, picasso.js chart examples, re-usable chart specs, and this wiki, and \`prompts.md\`/\`opencode.json\`/\`.pi/\` configure the AI-agent tooling used in development.

History and experimentation are deliberately quarantined. \`.archive/\` keeps superseded versions — including the original browser-only app (\`data-monster-old\`, DuckDB-WASM with a Node server) and chart-engine trials (echarts, svelteplot, observable) — while the nested \`data.monster/\` project generates the design-system documentation site, and \`build/\` is static-export output. \`global_superstore.csv\` at the root is the sample retail dataset used for demos and testing.

# LLM Sensitive Data Privacy Research

Research report (15 cited sources) on how to use LLMs with sensitive data in a data-analyst app. Compiled 2026-09-12 from web research; motivated by Data Monster's Analyst feature, which chats with an LLM (cloud APIs or local llama.cpp models) about data held in local DuckDB.

## What it documents

- The **Analyst** entry in the wiki glossary (\`docs/wiki/glossary.md\`) — LLM chat over data — is the feature this research informs.
- The recommended architecture for LLM data analysts: **schema-only text-to-SQL** — send schema + question to the LLM, execute generated SQL locally (DuckDB), return only aggregates or PII-masked results. "The model can't leak what it never saw."
- Three deployment tiers by sensitivity: local open-weight models (strongest, no egress/GDPR processor), enterprise cloud tiers with zero-data-retention contracts (OpenAI/Anthropic/Azure/Bedrock/Vertex), and never-consumer-endpoint data classes (patient records, HR/salary, customer PII, credentials).
- PII masking layer for text that must leave: Microsoft Presidio (local detection + replace/hash/encrypt, reversible Faker-based anonymization), with EDPB 2025 caveat that "anonymized" data rarely survives LLM-scale re-identification.
- Advanced privacy-enhancing tech (DP, federated learning, TEEs, FHE) — relevant for training, overkill for inference-time analysts; TEEs are the practical option for untrusted cloud inference.

## Key takeaway for Data Monster

The local-first DuckDB + llama.cpp path is already the gold-standard privacy story. Identified gaps if the Analyst feature is hardened:
1. Schema-only prompting when a cloud API model is selected (never send raw rows).
2. Read-only, SELECT-validated execution of LLM-generated SQL.
3. Aggregate/sanitized results fed back to the model instead of raw rows.

## Details

- **Format**: Markdown report with numbered citations, compiled 2026-09-12.
- **Location**: \`docs/research/llm-sensitive-data-privacy.md\`
- **Generated from**: web research session (vendor docs, OWASP LLM Top 10, EDPB/CNIL/GDPR guidance, text-to-SQL architecture pieces).

# BarChart component

## What is it?

Reusable SveltePlot-based bar chart component (\`BarChart.svelte\`), generic over the caller's row type. The second \`/labs\` chart-type built (after [heatmap-component](./heatmap-component.md)) — its card now leads the reordered Labs grid (Barchart → Line → Area → Scatter → Heatmap → …). Built on the [chart-fundament](./chart-fundament.md).

## Why it matters?

Second instance of the reusable-chart contract — proves the pattern generalizes past heatmaps. Aggregation runs through \`buildBars\` (top-N + Other bucket), so the component is a thin renderer.

## Details

- **Location**: \`src/lib/components/charts/BarChart.svelte\`; playground route \`src/routes/labs/bar-chart/\`; card in \`src/routes/labs/+page.svelte\`
- **Orientation**: horizontal — \`BarX\` mark, measure on the x number axis (grid + \`tickFormat\` via the renamed \`formatValue\` prop), dimension on the y band axis (\`padding: 0.3\`). The y domain is built explicitly from data order with \`reverse: true\`, so the caller's sort wins over svelteplot's alphabetical ordinal default (see [svelteplot-ordinal-domain-sorts-alphabetically](../../learnings/svelteplot-ordinal-domain-sorts-alphabetically.md)).
- **Interface**: accessor props (\`category\`, \`value\` accessors, generic \`<T>\`), bindable selection (matched via \`sameDatum\`, not identity), tooltip snippet (anchored x=value, y=category), mono data labels, empty-data guard
- **Config panel**: optional \`config\` snippet prop — when passed, a \`<Bolt />\` button at the top-right of the chart card toggles the chart's own [chartconfigdrawer-component](./chartconfigdrawer-component.md) (title \`<title> configuration\`); the page renders its fields via \`{#snippet config()}\` (see [each-labs-chart-owns-its-config-panel](../../rules/each-labs-chart-owns-its-config-panel.md))
- **Selection label**: inline right of the card title, vertically centered, \`·\` divider — \`Booked hours per month · May 25 · 122h\` (no floating pill). Card click-to-deselect ignores \`button\` clicks so toggling config doesn't clear the selection
- **Styling**: bars \`#888888\` deselected (\`color\` prop); selected bar fills DS green \`oklch(0.44 0.1 158)\` via \`fillOf\`. The fill channel passes \`scale: null\` so the literal color strings bypass svelteplot's color scale — \`scale: false\` does NOT bypass it (see [svelteplot-scale-bypass-needs-scale-null](../../learnings/svelteplot-scale-null-not-false.md))
- **Height**: \`plotHeight = innerHeight * heightVh\` — default \`heightVh = 0.3\` (30vh), overridable per call (e.g. \`<BarChart heightVh={0.5}>\`); same rule as the heatmap
- **Configuration**: optional \`topN\`/\`otherLabel\` aggregation opts passed to \`buildBars\`

# Chart page spec (spec-types + validator)

Central-charts FR-1: the TypeScript module holding the page document spec — \`PageDoc\` and all block/measure/dimension/filter/annotation/tooltip/axis types (\`src/lib/charts/spec-types.ts\`) plus the pure structural validator (\`src/lib/charts/validate.ts\`). Everything is plain serializable data; this is the single source of truth both editing surfaces (Design inspector ⇄ Code JSON) read and write.

## What is it?

The data contract of the central chart system. A \`PageDoc\` is \`{ slug, title, rows[] }\`; each row holds blocks (\`chart\` | \`table\` | \`text\`) with optional 12-column \`span\`. Measures are DuckDB expressions (\`{ expr, label?, fmt? }\`), dimensions are columns with optional \`grain\` — or master-item \`{ ref }\` references per the master-items amendment. Annotations use whitelisted svelteplot marks (\`arrow dot line ruleX ruleY text rect\`).

## Why it matters

Every later FR builds on it: the query compiler (FR-2) compiles these specs to SQL, the registry (FR-3) defines per-type roles, the dual-mode editor round-trips them. \`validatePageDoc(doc)\` returns \`{path, message}[]\` and **never throws** — used by Code mode, save, and render-time guards. Hand-rolled, no zod (spec constraint: no new npm deps).

- **Interface**: \`validatePageDoc(doc: unknown): ValidationError[]\`; type exports \`PageDoc\`, \`ChartBlock/TableBlock/TextBlock\`, \`ChartBlockSpec\`, \`MeasureSpec\`, \`DimensionSpec\`, \`FilterSpec\`, \`SortSpec\`, \`AnnotationSpec\`, \`TooltipSpec\`, \`AxisOptions\`

# ChartConfigDrawer component

A reusable drawer shell for chart configuration panels in \`/labs\`, hosted **inside each chart component**: a chart accepts an optional \`config\` snippet and toggles its own drawer via a \`<Bolt />\` button at the top-right of the chart card. First used by the BarChart component at \`/labs/bar-chart\`.

## Details

- **Location**: \`src/lib/components/charts/ChartConfigDrawer.svelte\`
- **Interface / Schema**: props are \`open\` (bindable), \`title\`, and a \`children\` snippet for the fields. Ships shared \`.field\` / \`.field-label\` / \`.field-hint\` / \`.input\` styles for whatever the chart renders inside. Charts open it with the title \`<title> configuration\`.
- **Hosting pattern** (2026-09-15): the chart component renders the drawer when the caller passes a \`config\` snippet — the Bolt toggle only appears if the snippet is passed (opt-in; heatmap doesn't have it yet). Before this, the *page* hosted the drawer via a Configure button + Settings2 icon — superseded.
- **Pattern source**: the drawer shell (overlay + slide-in panel + header/close) reuses the established \`ColumnFunctionDrawer.svelte\` pattern rather than a new abstraction — pages stay thin, no generic field renderer needed.
- **Marked \`data-drawer\`** and card click-to-deselect ignores \`button\` clicks, so configuring never clears a selection.

## Config-vs-accessor convention

When exposing "reusable config variables" for a chart, only **config props** get UI controls — not data accessors or state:

- \`title\`, \`subtitle\` (strings) → text input
- \`color\` (hex) → native color picker
- \`heightVh\` (viewport fraction) → range slider with live readout

Props like \`category\`, \`value\`, \`tooltip\`, \`labelFor\`, \`selected\` are data accessors/state and stay out of config drawers.

## Relationships

- Hosted inside [barchart-component](./barchart-component.md) via its \`config\` snippet + Bolt toggle
- [each-labs-chart-owns-its-config-panel](../../rules/each-labs-chart-owns-its-config-panel.md) — the hosting rule
- Supports all charts built on the [chart-fundament](./chart-fundament.md) per [labs-charts-reusable-fundament](../../rules/labs-charts-reusable-fundament.md)
- Sibling shell pattern: ColumnFunctionDrawer (\`src/lib/components/ColumnFunctionDrawer.svelte\`)
- Fits the placeholder-first labs catalog plan — [labs-per-chart-type](../../decisions/labs-per-chart-type.md)

## Lifecycle

- First added: 2026-09-15 — bar-chart config drawer request; four live-bound fields (title, subtitle, color, heightVh), edits apply immediately. Originally page-hosted (Configure button, Settings2 icon).
- 2026-09-15: hosting moved into the chart component — optional \`config\` snippet prop + \`<Bolt />\` toggle top-right of the chart card; page-level button and drawer removed; drawer title now \`<title> configuration\`.

A user-extensible library of SQL field functions (e.g. formatting, extraction, math) that can be applied to table columns from the column drawer, backed by the \`d8a_monster_field_functions\` internal DuckDB table.

## What it is

The Field Functions subsystem lets users define reusable SQL templates that transform a column, then apply them when browsing tables. Functions are managed in Settings (\`/settings/field-functions\`) and applied via the column drawer (\`ColumnFunctionDrawer.svelte\`) on the Data/Table views. Spec: \`.specs/field-function-library\`.

## Why it matters

It extends the table browsing experience beyond read-only viewing — users can derive new columns without writing full SQL, which feeds the Analyst and Pages workflows.

## Details

- **Rust backend**: \`src-tauri/src/commands/field_functions.rs\` — CRUD Tauri commands over \`d8a_monster_field_functions\` (id, label, description, sql_template, applies_to, output_type), registered in \`commands/mod.rs\` / \`main.rs\`

- **UI**: \`src/lib/components/ColumnFunctionDrawer.svelte\` (apply to a column), \`src/routes/settings/field-functions/\` (manage library)
- **Storage**: internal DuckDB table \`d8a_monster_field_functions\`, browsable via Settings → Internal DB browser

- **Cancellation**: shares the \`generate_cancel\` flag with local generation, so the Analyst Stop button covers both modes

# .wiki_ignore staleness policy

## What is it?

\`.wiki_ignore\` at the repo root is the project-level staleness-detection config for the OKF wiki: paths listed here never trigger the "wiki may be stale" warning, because changes to them don't change what the wiki documents. As of 2026-09-12 it is **additive** — the wiki-context extension now merges ~40 always-on built-in ignore patterns (BUILTIN_IGNORES) inside \`loadIgnore()\`, so common build trees are ignored even without a \`.wiki_ignore\` entry.

## Why it matters

Without ignores, every build artifact and archived experiment (thousands of files under \`src-tauri/target/\`, \`.archive/\`) falsely marks the wiki stale and drowns out real product-code changes.

## Details

- **Location**: \`E:/data.monster/.wiki_ignore\`
- **Format**: gitignore-style patterns, \`#\` comments
- **Layering**: extension \`BUILTIN_IGNORES\` (Rust \`target/\`, Python \`.venv/\`/caches, JVM \`.gradle/\`, .NET \`bin/\`/\`obj/\`, Apple \`Pods/\`/\`DerivedData/\`, Flutter \`.dart_tool/\`, JS meta-frameworks, Terraform, lock files) are always-on and merged in \`loadIgnore()\` — the single choke point BOTH the staleness scan and file-tree generation route through, with or without a \`.wiki_ignore\` present. This file only adds project-specific entries on top.

**Ignored (do NOT affect staleness):**

- \`docs/wiki/\` — self-ignore; wiki edits aren't product changes
- Standard caches: \`node_modules/\`, \`dist/\`, \`build/\`, \`.next/\`, \`.cache/\`, \`__pycache__/\`, \`.DS_Store\`
- \`src-tauri/target/\` — Rust build tree (added 2026-09-12 after it caused a 3485-file staleness flood; no earlier pattern matched it)
- \`.archive/\` — superseded old app + chart trials; historical, huge, never affects wiki staleness
- \`.svelte-kit/\`, \`.cargo/\`, \`.work/\`, \`.pi/\`, \`.opencode/\` — build caches and agent/tooling state that churn constantly
- \`data.monster/\` — nested design-docs site generator, generated output
- \`.env\`, \`data/\`, \`global_superstore.csv\` — data and secrets, never scanned

**Tracked (changes SHOULD trigger staleness):**

- \`src/\`, \`src-tauri/\` (except \`target/\`), \`.specs/\`, \`.prds/\`, \`docs/\` (non-wiki) — the product code and specs the wiki documents

## Lifecycle

- First added: 2026-09-11 — generic defaults only (caches, self-ignore)
- Significant changes: 2026-09-11 — project-specific entries added after stale detection fired on ~3500 build/archive files
- Significant changes: 2026-09-12 — \`src-tauri/target/\` added after a 3485-file flood (it matched no pattern); same day the wiki-context extension gained always-on BUILTIN_IGNORES merged in \`loadIgnore()\`, making this file additive-only

## Relationships

- the wiki overview ([../../overview.md](../../overview.md)) — the wiki documents this project's structure; \`.wiki_ignore\` keeps its staleness signal clean

# Each /labs chart owns its config panel

## Guideline

In \`/labs\`, chart configuration UI lives **inside the chart component**, never on the page:

- The chart component accepts an optional \`config\` snippet prop.
- When the snippet is passed, the component renders a \`<Bolt />\` icon button at the **top-right of the chart card**; clicking it toggles the chart's own [[chartconfigdrawer-component]] (drawer title = \`<title> configuration\`).

## When it applies

Every chart-type component built on the [[chart-fundament]] (bar chart done; heatmap gets it with one prop pass when its page needs a panel; applies to the 30 charts still to come).

## Rationale

A labs page can host many chart cards — a page-level drawer can only configure one of them. Per-chart panels scale to the catalog. Requested explicitly 2026-09-15 ("each chart has its own panel for config"); the \`/labs/bar-chart\` page was migrated the same day.

## Gotchas

- Card click-to-deselect must ignore \`button\` clicks (and the drawer carries \`data-drawer\`) so toggling config doesn't clear the bar selection.

type: Rule
title: "Feature-loop hard rules: PR-only shipping, opt-in worktrees, no force removal"
