# Feature-loop hard rules: PR-only shipping, opt-in worktrees, no force removal

## Guideline

When running the feature-loop workflow (or any change work) in this repo:

- **Never push or merge directly to master.** Every change ships via a PR, even small fixes. Railway deploys from master, so a branch push deploys nothing — the merge is the release trigger.
- **Worktrees are opt-in.** Ask, wait for an explicit yes, and only then create one. No answer = work on a feature branch in the main tree. Recommend, never decide.
- **Never \`--force\` a worktree removal or \`git branch -D\` without asking first.** Stale worktrees are swept only when provably lossless: clean \`git status --porcelain\` AND empty \`git log --oneline origin/master..<branch>\`. Skip anything locked, dirty, or with unmerged commits — likely another session's active task.
- **Branch names carry the task slug** (\`feature/<slug>\`), never generic or improvised names. Always branch from fresh master (\`git pull --ff-only\` first; stop and report if it fails).
- **Type-check is the staging-miss gate.** Run \`svelte-check\` (and tests) before opening a PR and again after merge alignment — selective staging can silently omit files (2026-09-14: the \`BarDatum\` interface→type fix missed staging, shipped 3 type errors to master, fix-forwarded as PR #2).

## When it applies

Every session that makes changes to this repo, especially feature-loop runs. The user merges PRs themselves — the agent never merges.

## Rationale

Stated by the user as "hard rules — no exceptions" (2026-09-14 feature-loop run). Protects master as the deploy branch, avoids clobbering concurrent sessions' worktrees, and keeps the human in control of merge decisions.

# Inter for UI text, Geist Mono only for data detail

## Guideline
Every new UI surface follows the two-font rule set in \`src/app.css\`:

- **Inter** (\`--font-display\`, \`--font-body\`) for all UI text — headings, labels, buttons, prose, nav, modals.
- **Geist Mono** (\`--font-mono\`) **only for data detail**: table cells/headers (\`.data-table th/td\`), chart axis ticks, in-cell chart labels (Picasso canvases, svelteplot \`Heatmap.svelte\`), and code/IDs.

## When it applies
Any new component, route, or chart. If the text renders a data value or helps read one off a chart/table → mono. Everything else → Inter.

## Rationale
User decision (2026-09-14, see [[typography-inter-mono-for-data]]): mono visually marks "machine data" vs UI chrome, and \`tabular-nums\` alignment in mono keeps dense tables legible. Never hardcode a font-family — use the CSS vars so token changes propagate.

# Interview the user one question at a time with lettered multiple-choice options

## Guideline

When conducting any interview with the user (PRD, design, spec, scoping), ask questions **one at a time**, with multiple-choice answers labeled **A) B) C)…** (or numbered). Before the first question, give a short shared-context block (vocabulary, what was studied, where we already stand) so each question lands on common ground. It is fine to state a lean/recommendation for the options — but let the user pick.

## When it applies

Every interactive question-and-answer flow where the assistant gathers requirements or decisions from the user — e.g. \`.prds/\` PRD interviews, the central reusable-chart design interview (2026-09-15), wizard-style flows.

## Rationale

The user asked for this format explicitly at the start of the chart-design interview ("ask me all questions 1-by-1 using letters/numbers for multi choice responses"). Single lettered questions are answerable in one short reply, keep complex decisions from collapsing into wall-of-text answers, and make the chosen option unambiguous in the transcript (useful when the final decision gets recorded to docs/wiki later).

# Keep test files and vitest imports out of src/

# Keep test files and vitest imports out of src/

## Guideline

Test files (anything importing \`vitest\`/\`@testing-library\` etc.) live in the top-level \`tests/\` directory — **never inside \`src/\`**, and never co-located next to the module under test.

## When it applies

Every time a test is added or moved in this project. Currently \`tests/fundament.test.ts\` (chart fundament, 9 tests) is the pattern to follow.

## Rationale

Vite's dev-server dep-optimizer scans everything reachable from \`src/\`. A \`vitest\` import inside the source tree makes the optimizer choke, which surfaced as the \`/labs\` bar-chart "hang" (2026-09-14): the bar-chart page was the only page importing from \`$lib/charts/\`, where \`fundament.test.ts\` sat, and clicking its card froze the app in an infinite vite reconnect loop. Moving the test to \`tests/\` (PR #3, commit \`9f18749\`) removed the trigger. Full story: [[labs-hang-vite-reload-loop]].

- \`tests/fundament.test.ts\` — current location

# Pin Tailwind @source scanning to src/ and app.html in app.css

# Pin Tailwind @source scanning to src/ and app.html in app.css

## Guideline

\`src/app.css\` must keep its Tailwind 4 \`@source\` directives pinned:

\`\`\`css
@source './**/*.{svelte,ts,html}';
@source '../app.html';
\`\`\`

Do not widen them back to scanning the repo root, and do not remove them "to pick up classes from new folders" without pinning the new folder explicitly.

## When it applies

Any edit to \`src/app.css\` or any time Tailwind seems to "miss" classes — the lazy fix is adding an explicit \`@source\` for the new folder, not unpinning.

## Rationale

Without the pin, the Tailwind dev watcher scans the whole project tree. *Any* file write — vite's own log files, wiki writes (\`docs/wiki/\`), agent session files — makes Tailwind re-emit \`app.css\` → SvelteKit performs a full reload → the writing continues → infinite reload loop (the \`/labs\` hang amplifier, 2026-09-14). The repo generates constant non-source file churn during agent-assisted development, so this loop is not hypothetical here. Full story: [[labs-hang-vite-reload-loop]].

## Source

- \`src/app.css\` lines 6–7 — the pin
- PR creatuluw/data.monster#3, commit \`9f18749\`

# Route external API calls through Rust commands, never webview fetch

## Guideline

Never call external HTTP APIs directly from the Tauri webview with \`fetch\` — the webview is a browser context and CORS applies. Route the call through a Tauri command using \`reqwest\` on the Rust side, which has no CORS restrictions.

## When it applies

Any time the frontend needs to reach a third-party API (LLM providers, URLs ingested from Connect, webhooks, etc.).

## Rationale

The Analyst page's remote LLM chat was completely broken because \`fetch\` to \`https://api.z.ai\` failed CORS preflight. The fix (2026-09) moved the call into the \`remote_chat\` Rust command streaming back over \`local-llm:*\` events. Webview-origin network restrictions will bite every direct external fetch the same way.

## Note

Fetching user-supplied data URLs during Connect/ingest is already handled on the Rust side for the same reason.

# Spec-driven features: TDD + Karpathy skills referenced in every todo

## Guideline

New spec-driven features follow the **chart-lib pattern**:

- Spec lives at \`.specs/<name>/spec.md\` — FRs grouped into phases.
- Tasks mirror the FRs in \`.specs/<name>/tasks.json\`.
- Todos are created in \`.pi/todos\`, each tagged with its phase.
- **Every todo instructs reading the \`tdd-workflow\` and \`karpathy-guidelines\` skills before starting** — TDD and Karpathy constraints are baked into each task's acceptance criteria, not left to the implementer's judgment.
- On completion, a task-log entry is appended to the spec.

## When it applies

Any new feature large enough to warrant a spec (central-charts, chart-lib, field-function-library, local-llm, tauri-migration all follow it).

## Rationale

Keeps acceptance criteria uniform across sessions and implementers; the skills-loaded-first instruction prevents TDD from silently degrading to test-after on later todos.
